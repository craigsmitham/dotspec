# Canonical experimental model. Regenerate projections; do not edit generated files.
id: https://github.com/craigsmitham/dotspec/model/dotspec.yaml
name: dotspec_metamodel
title: Dotspec specification metamodel
version: 0.5.0-draft
description: Experimental first-class metamodel for source-backed specification snapshots. The exported model
  is distinct from Markdown authoring checks. Source fidelity, syntax interpretation, named domain mapping,
  and optional structured decomposition are separate concerns. Existing prose is valid domain content; fields
  and relationships are populated only by explicit syntax or a declared mapping rule, never by unrecorded NLP
  inference. Raw source alone does not establish domain coverage.
prefixes:
  ds: https://github.com/craigsmitham/dotspec/model/
  linkml: https://w3id.org/linkml/
default_prefix: ds
default_range: string
imports:
- linkml:types
annotations:
  status: experimental
  runtime_target: Generated JSON Schema plus explicit graph checks; no generated-Go reliance.
  graph_rules: Identifier uniqueness; referential integrity and typed endpoints; containment ownership and
    cycle rules; source-byte digest, offset-map and span fidelity; ordered syntax-tree and membership consistency;
    complete content-binding accounting; scope and resolution consistency; owner-local attribute identity/subattribute_of
    cycles; paired quality attribute declarations and section content; honest optional decomposition; assertion provenance and consistency are explicit graph checks,
    not implied by JSON Schema generation.
subsets:
  business-requirements:
    title: Business requirements
    description: Business objectives, scope, assumptions, and rules governing permissible business activity.
    annotations:
      classification: core
  user-requirements:
    title: User requirements
    description: The progress people seek, their circumstances, work, and desired outcomes.
    annotations:
      classification: core
  software-requirements:
    title: Software requirements
    description: Software interactions, concept behavior, obligations, quality classifications, and verification guidance.
    annotations:
      classification: core
  specification-traceability:
    title: Specification traceability
    description: Explicit connections between specification meaning, authored occurrences, and resolved relationships.
    annotations:
      classification: core
  inspection-and-coverage:
    title: Inspection and coverage
    description: The scope, completion, diagnostics, and mapping coverage of an inspection.
    annotations:
      classification: supporting
  document-content:
    title: Document content
    description: Ordered document syntax, rich text, and preserved extension content.
    annotations:
      classification: generic
  source-artifacts:
    title: Source artifacts
    description: Source identities, exact payloads, revisions, fragments, and locations.
    annotations:
      classification: generic
classes:
  Record:
    in_subset: [source-artifacts]
    description: An addressable record in one snapshot. All IDs are unique across snapshot collections.
    abstract: true
    slots:
    - id
    - kind
  Snapshot:
    in_subset: [inspection-and-coverage]
    description: A bounded and potentially incomplete observation of source documents and their mapped domain
      content.
    attributes:
      model_version:
        range: string
        required: true
        equals_string: 0.5.0-draft
      mapping_profile:
        range: string
        description: Versioned set of recognized sections, aliases, metadata keys, and explicit decomposition
          rules.
        required: true
      scope:
        range: ScanScope
        required: true
        inlined: true
      sources:
        range: SourceResource
        required: true
        multivalued: true
        inlined_as_list: true
      documents:
        range: Document
        required: true
        multivalued: true
        inlined_as_list: true
      content_nodes:
        range: ContentNode
        required: true
        multivalued: true
        inlined_as_list: true
      fragments:
        range: SourceFragment
        multivalued: true
        inlined_as_list: true
      elements:
        range: DomainElement
        required: true
        multivalued: true
        inlined_as_list: true
      references:
        range: SourceReference
        multivalued: true
        inlined_as_list: true
      label_occurrences:
        range: LabelOccurrence
        multivalued: true
        inlined_as_list: true
      resolutions:
        range: Resolution
        multivalued: true
        inlined_as_list: true
      assertions:
        range: Assertion
        description: Optional materialized relation views; derive from typed fields or explicit authored semantic
          relations, and check consistency.
        multivalued: true
        inlined_as_list: true
      content_bindings:
        range: ContentBinding
        required: true
        multivalued: true
        inlined_as_list: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        inlined_as_list: true
      coverage:
        range: CoverageReport
        required: true
        inlined: true
      representation_version:
        range: string
        description: Version of this serialized snapshot contract, separate from the domain metamodel version.
        required: true
        equals_string: 0.1.0
      context_sources:
        range: ContextSource
        multivalued: true
        inlined_as_list: true
    tree_root: true
  ScanScope:
    in_subset: [inspection-and-coverage]
    description: Declared scan boundary and completion, independently of whether individual documents are valid.
    attributes:
      roots:
        range: string
        required: true
        multivalued: true
      included_patterns:
        range: string
        multivalued: true
      excluded_patterns:
        range: string
        multivalued: true
      discovery_complete:
        range: boolean
        required: true
      reads_complete:
        range: boolean
        required: true
      inspection_complete:
        range: boolean
        required: true
      limitations:
        range: string
        multivalued: true
      selected_spec_kinds:
        range: SpecificationKind
        required: true
        multivalued: true
      discovery_policy:
        range: DiscoveryPolicy
        required: true
        inlined: true
      reference_traversal:
        range: ReferenceTraversal
        required: true
        inlined: true
  SourceResource:
    in_subset: [source-artifacts]
    description: An addressable source; only SourceDocument implies locally acquired bytes.
    is_a: Record
    abstract: true
  SourceDocument:
    in_subset: [source-artifacts]
    description: A discovered Markdown or related file. A failed read retains identity, locator, status and
      diagnostics.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDocument
    attributes:
      locator:
        range: string
        required: true
      read_status:
        range: ReadStatus
        required: true
      media_type:
        range: string
      payload:
        range: SourcePayload
        description: Present only after successful read; graph rule requires it for read_status=read.
        inlined: true
      diagnostics:
        range: Diagnostic
        multivalued: true
      revision:
        range: SourceRevision
        inlined: true
    rules:
    - description: A successful read includes a source payload.
      preconditions:
        slot_conditions:
          read_status:
            equals_string: read
      postconditions:
        slot_conditions:
          payload:
            required: true
  ExternalResource:
    in_subset: [source-artifacts]
    description: An external address explicitly mentioned by source; no implied fetch or trust.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: ExternalResource
    attributes:
      locator:
        range: string
        required: true
      media_type:
        range: string
  SourcePayload:
    in_subset: [source-artifacts]
    description: Exact original bytes before Goldmark/specfile normalization, including BOM, CRLF, trailing
      newlines and invalid encodings.
    attributes:
      storage:
        range: PayloadStorage
        required: true
      sha256:
        range: string
        required: true
        pattern: ^[a-f0-9]{64}$
      byte_length:
        range: integer
        required: true
        minimum_value: 0
      bytes_base64:
        range: string
        description: Required for inline_base64 storage; decode and verify digest and byte count.
      immutable_locator:
        range: string
        description: Required for external storage; bytes must remain retrievable and match the digest.
      text_encoding:
        range: string
        description: Detected or declared decoding; original bytes remain authoritative.
    rules:
    - description: Inline storage includes the recoverable original bytes.
      preconditions:
        slot_conditions:
          storage:
            equals_string: inline_base64
      postconditions:
        slot_conditions:
          bytes_base64:
            required: true
    - description: External storage identifies recoverable immutable original bytes.
      preconditions:
        slot_conditions:
          storage:
            equals_string: external
      postconditions:
        slot_conditions:
          immutable_locator:
            required: true
  ByteSpan:
    in_subset: [source-artifacts]
    description: Half-open [start,end) offsets into ORIGINAL bytes of one SourceDocument. Graph checks enforce
      bounds and start <= end.
    attributes:
      source:
        range: SourceDocument
        required: true
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
  OffsetMapSegment:
    in_subset: [document-content]
    description: Maps a normalized parser buffer interval to original bytes; segments must be monotone and
      account for removals/replacements such as BOM and CRLF.
    attributes:
      normalized_start:
        range: integer
        required: true
        minimum_value: 0
      normalized_end:
        range: integer
        required: true
        minimum_value: 0
      original_start:
        range: integer
        required: true
        minimum_value: 0
      original_end:
        range: integer
        required: true
        minimum_value: 0
      transformation:
        range: string
        description: Identity, BOM removal, line-ending normalization, or another declared transformation.
        required: true
  Document:
    in_subset: [document-content]
    description: Syntax and interpretation state for an acquired document, separate from its SourceDocument
      read state.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Document
    attributes:
      source:
        range: SourceDocument
        required: true
      parse_status:
        range: ParseStatus
        required: true
      parser:
        range: string
        description: Parser name/version and dialect, e.g. the current Goldmark-based syntax pipeline.
        required: true
      root:
        range: ContentNode
        description: Root includes frontmatter, all Markdown, and retained trivia/opaque spans.
        required: true
      frontmatter:
        range: ContentNode
        description: Frontmatter roots with parsed YAML trees or opaque invalid content.
        multivalued: true
        list_elements_ordered: true
      frontmatter_parse_status:
        range: ParseStatus
      declared_type:
        range: string
        description: Interpreted known metadata type; original key/value syntax remains in the tree.
      authored_id:
        range: string
        description: Interpreted document ID when available; invalid metadata remains in the tree and diagnostics.
      metadata_root:
        range: ContentNode
        description: Parsed YAML root; ordered mapping entries preserve arbitrary keys, duplicate keys, lists,
          tags and scalar types.
      normalization:
        range: OffsetMapSegment
        description: Required when parser byte offsets differ from original bytes; no guessed offsets.
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      domain_decomposition:
        range: DecompositionStatus
        required: true
      elements:
        range: DomainElement
        multivalued: true
      coverage:
        range: CoverageReport
        required: true
        inlined: true
      diagnostics:
        range: Diagnostic
        multivalued: true
  ContentNode:
    in_subset: [document-content]
    description: An ordered source syntax node. Raw spans preserve exact syntax; typed properties expose parsed
      structure without requiring every dialect to be understood.
    is_a: Record
    slot_usage:
      kind:
        equals_string: ContentNode
    attributes:
      document:
        range: Document
        required: true
      node_kind:
        range: NodeKind
        required: true
      span:
        range: ByteSpan
        required: true
        inlined: true
      children:
        range: ContentNode
        description: Ordered direct children. YAML entry children are key then value; repeated mappings are
          retained, not collapsed.
        multivalued: true
        list_elements_ordered: true
      heading_level:
        range: integer
        minimum_value: 1
        maximum_value: 6
      list_ordered:
        range: boolean
      list_start:
        range: integer
      list_delimiter:
        range: string
      task_state:
        range: string
      code_info:
        range: string
      destination:
        range: string
        description: Parsed link/image/reference destination; authored spelling stays in the raw span.
      title:
        range: string
      label:
        range: string
      decoded_text:
        range: string
        description: Optional decoded textual view; never a replacement for source bytes.
      scalar_kind:
        range: ScalarKind
      scalar_tag:
        range: string
      scalar_string:
        range: string
      scalar_boolean:
        range: boolean
      scalar_integer:
        range: integer
      scalar_float:
        range: double
      scalar_timestamp:
        range: datetime
      scalar_binary_base64:
        range: string
      anchor_name:
        range: string
      alias_name:
        range: string
      syntax_properties:
        range: SyntaxProperty
        description: Dialect properties not covered by dedicated syntax fields.
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      opaque_reason:
        range: string
        description: Required by graph checks for opaque nodes; distinguish unsupported, malformed, and unparsed
          syntax.
  SyntaxProperty:
    in_subset: [document-content]
    description: A typed syntax extension property, retained without asserting domain meaning.
    attributes:
      name:
        range: string
        required: true
      value:
        range: string
        required: true
      value_type:
        range: ScalarKind
  SourceFragment:
    in_subset: [source-artifacts]
    description: An addressable heading, explicit anchor, or occurrence in a source document, without implying
      domain-element identity.
    is_a: Record
    slot_usage:
      kind:
        equals_string: SourceFragment
    attributes:
      source:
        range: SourceDocument
        required: true
      content_node:
        range: ContentNode
      span:
        range: ByteSpan
        inlined: true
      authored_anchor:
        range: string
      generated_anchor:
        range: string
      anchor_rule:
        range: string
  RichContent:
    in_subset: [document-content]
    description: A typed domain value backed by ordered syntax nodes. Omitted slot means absent; presence=empty
      means an explicitly present empty field. Narrative remains valid without fabricated atomic assertions.
    attributes:
      presence:
        range: Presence
        required: true
      content_nodes:
        range: ContentNode
        description: Ordered non-overlapping roots of this field value; an empty field has no body nodes.
        required: true
        multivalued: true
        list_elements_ordered: true
      decomposition:
        range: DecompositionStatus
        description: State of optional finer structure, independent of named-field mapping coverage.
        required: true
    rules:
    - description: An explicitly empty field has no body content nodes; this rule requires the content checker
        in the selected JSON projection.
      preconditions:
        slot_conditions:
          presence:
            equals_string: empty
      postconditions:
        slot_conditions:
          content_nodes:
            maximum_cardinality: 0
            range: ContentNode
            multivalued: true
    - description: An authored field points to at least one source content node; this rule requires the content
        checker in the selected JSON projection.
      preconditions:
        slot_conditions:
          presence:
            equals_string: authored
      postconditions:
        slot_conditions:
          content_nodes:
            minimum_cardinality: 1
            range: ContentNode
            multivalued: true
    annotations:
      json_schema_projection_gap: LinkML 1.12.1 omits minItems/maxItems for the presence-dependent class-rule
        cardinality. Preserve these formal rules and enforce empty/authored node cardinality in the graph/content
        checker; do not claim JSON Schema alone enforces them.
  ContentBinding:
    in_subset: [specification-traceability]
    description: Auditable mapping from source syntax to a named domain field, metadata, structural support,
      unknown extension, or uninterpreted fallback.
    is_a: Record
    slot_usage:
      kind:
        equals_string: ContentBinding
    attributes:
      content_node:
        range: ContentNode
        required: true
      scope:
        range: BindingScope
        required: true
      owner:
        range: Record
        description: Owning Document, DomainElement, or other addressable record.
        required: true
      field_path:
        range: string
        description: Model slot path relative to owner; graph check verifies it exists and points to the represented
          value.
        required: true
      role:
        range: BindingRole
        required: true
      mapping_rule:
        range: string
        description: Versioned mapping rule, including recognized heading alias.
        required: true
      known_role:
        range: string
        description: Recognized domain role, if any; a known role routed to fallback remains unmapped in coverage.
      reason:
        range: string
        description: Required for fallback or extension bindings; explain the interpretive boundary.
      occurrence_index:
        range: integer
        description: Zero-based source occurrence for repeated fields/sections, when needed; duplicate authoring
          remains separately diagnosable.
        minimum_value: 0
  CoverageReport:
    in_subset: [inspection-and-coverage]
    description: A checked accounting of representation and named-role mapping, not a claim that every prose
      proposition was formalized.
    attributes:
      status:
        range: CoverageStatus
        required: true
      mapping_profile:
        range: string
        required: true
      unbound_content_nodes:
        range: ContentNode
        description: Syntax not covered by any applicable binding; prevents complete_for_profile.
        multivalued: true
      unmapped_known_roles:
        range: UnmappedRole
        description: Recognized content still lacking its named domain mapping; prevents complete_for_profile.
        multivalued: true
        inlined_as_list: true
      extension_sections:
        range: ExtensionSection
        description: Unknown domain headings, explicitly retained; not evidence of complete domain semantics.
        multivalued: true
      uninterpreted_nodes:
        range: ContentNode
        description: Retained opaque or fallback syntax, separate from unknown domain sections.
        multivalued: true
      limitations:
        range: string
        multivalued: true
  UnmappedRole:
    in_subset: [inspection-and-coverage]
    description: A known domain field or item whose source content has not yet been mapped.
    attributes:
      role:
        range: string
        required: true
      content_nodes:
        range: ContentNode
        required: true
        multivalued: true
        list_elements_ordered: true
      reason:
        range: string
        required: true
  DomainElement:
    in_subset: [business-requirements, user-requirements, software-requirements]
    description: A source-backed semantic record. Snapshot IDs are required; authored IDs remain optional except
      where the source format requires them.
    is_a: Record
    abstract: true
    attributes:
      source_document:
        range: SourceDocument
        required: true
      name:
        range: RichContent
        description: Authored title or item name, if present.
        inlined: true
      source_fragment:
        range: SourceFragment
      decomposition:
        range: DecompositionStatus
        required: true
      open_decisions:
        range: OpenDecisionCollection
        inlined: true
        description: Explicitly headed unresolved questions, with full section content preserved; omitted fields
          are not inferred decisions.
      extension_sections:
        range: ExtensionSection
        description: Only unknown sections, not a substitute for known domain fields.
        multivalued: true
        list_elements_ordered: true
    slots:
    - authored_id
    annotations:
      owned_memberships: DomainElement.extension_sections
  SpecificationElement:
    in_subset: [business-requirements, user-requirements, software-requirements]
    description: Common content of system, job, use-case, concept and requirement documents; narrative authority/evidence
      does not create executable authority assertions.
    is_a: DomainElement
    abstract: true
    attributes:
      slug:
        range: string
        description: Path-derived current slug where applicable.
      owning_system:
        range: System
        description: Derived directory ownership, not use-case boundary or requirement inheritance.
      related_specifications:
        range: ContextualReferences
        inlined: true
      related_concepts:
        range: ContextualReferences
        inlined: true
      authority_and_evidence:
        range: RichContent
        description: Maps both Authority and Authority and evidence headings; retain original heading nodes.
        inlined: true
      evidence:
        range: EvidenceCollection
        inlined: true
      notes:
        range: RichContent
        description: Recognized Notes content.
        inlined: true
      preamble:
        range: RichContent
        description: Authored content between the title and the first named section.
        inlined: true
      business_rules:
        description: Contextual references to governing business rules; does not assert enforcement or compliance.
        range: ContextualReferences
        inlined: true
      related_use_cases:
        range: ContextualReferences
        description: Contextual citations of related use cases; no implicit inclusion, refinement or support
          relation.
        inlined: true
    annotations:
      owned_memberships: SpecificationElement.evidence.statements
  BusinessRule:
    in_subset: [business-requirements]
    description: A declarative business constraint independent of the software or process that enforces it.
    is_a: SpecificationElement
    slot_usage:
      kind:
        equals_string: BusinessRule
    attributes:
      statement:
        description: The rule expressed in business language, independently of enforcement.
        range: RichContent
        inlined: true
      applies_to:
        range: Applicability
        inlined: true
      rationale:
        range: RichContent
        inlined: true
      exceptions:
        description: Authored qualifications or references to exception rules; no inferred exemption.
        range: RichContent
        inlined: true
  QualityModel:
    in_subset: [software-requirements]
    description: A standalone reusable set of quality attribute definitions. Copying creates independent system declarations; no live inheritance or synchronization.
    is_a: SpecificationElement
    slot_usage:
      kind:
        equals_string: QualityModel
    attributes:
      description:
        range: RichContent
        inlined: true
      edition:
        range: RichContent
        inlined: true
      sources:
        range: ContextualReferences
        inlined: true
      quality_attributes:
        range: QualityAttribute
        multivalued: true
        list_elements_ordered: true
        description: Ordered model definitions; must be present together with quality_attributes_content.
      quality_attributes_content:
        range: RichContent
        inlined: true
        description: Complete authored attribute section; absent and empty declarations remain distinct.
    annotations:
      owned_memberships: QualityModel.quality_attributes
  System:
    in_subset: [business-requirements, software-requirements]
    description: The system described by a system document; subordinate systems retain their own boundaries
      and quality attributes.
    is_a: SpecificationElement
    slot_usage:
      kind:
        equals_string: System
    attributes:
      parent_system:
        range: System
        description: Directory-derived containment; no inheritance of requirements, labels, or thresholds.
      purpose:
        range: RichContent
        inlined: true
      scope:
        range: RichContent
        inlined: true
      goals:
        range: GoalCollection
        inlined: true
      environment:
        range: EnvironmentDescription
        inlined: true
      assumptions:
        range: AssumptionCollection
        inlined: true
      constraints:
        range: ConstraintCollection
        inlined: true
      glossary:
        range: Glossary
        inlined: true
      quality_attributes:
        range: QualityAttribute
        description: Attributes declared by this system, in authored order. Absent means no declaration; a present empty list is distinct. Must be present together with quality_attributes_content.
        multivalued: true
        list_elements_ordered: true
      quality_attributes_content:
        range: RichContent
        description: Authored Quality attributes section content, including narrative and attribute subsections. Present even when the section is empty.
        inlined: true
    annotations:
      owned_memberships: System.goals.items or System.assumptions.items or System.constraints.items or System.glossary.terms
        or System.quality_attributes
  GoalCollection:
    in_subset: [business-requirements]
    description: Goals section narrative and optional explicitly authored goal records.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      items:
        range: SystemGoal
        multivalued: true
        list_elements_ordered: true
  AssumptionCollection:
    in_subset: [business-requirements, software-requirements]
    description: Assumptions section narrative and optional explicitly authored assumptions.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      items:
        range: Assumption
        multivalued: true
        list_elements_ordered: true
  ConstraintCollection:
    in_subset: [business-requirements, software-requirements]
    description: Constraints section narrative and optional explicitly authored constraints.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      items:
        range: Constraint
        multivalued: true
        list_elements_ordered: true
  Glossary:
    in_subset: [business-requirements, software-requirements]
    description: Glossary section introduction and explicitly named terms.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      terms:
        range: GlossaryTerm
        multivalued: true
        list_elements_ordered: true
  EnvironmentDescription:
    in_subset: [business-requirements, software-requirements]
    description: System environment, retaining narrative and explicitly separated participants or contextual
      boundaries.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      participants:
        range: ActorMention
        multivalued: true
        inlined_as_list: true
      context:
        range: RichContent
        inlined: true
  SystemGoal:
    in_subset: [business-requirements]
    description: An explicitly distinguished system goal.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: SystemGoal
    attributes:
      owner:
        range: System
        required: true
      statement:
        range: RichContent
        inlined: true
  Assumption:
    in_subset: [business-requirements, software-requirements]
    description: An explicitly distinguished system assumption; no inferred truth assertion.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: Assumption
    attributes:
      owner:
        range: System
        required: true
      statement:
        range: RichContent
        inlined: true
  Constraint:
    in_subset: [business-requirements, software-requirements]
    description: An explicitly distinguished system constraint.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: Constraint
    attributes:
      owner:
        range: System
        required: true
      statement:
        range: RichContent
        inlined: true
  GlossaryTerm:
    in_subset: [business-requirements, software-requirements]
    description: An explicitly named term and its definition in a system glossary.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: GlossaryTerm
    attributes:
      owner:
        range: System
        required: true
      definition:
