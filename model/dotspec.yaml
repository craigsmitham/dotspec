  ScalarKind:
    description: Interpreted metadata scalar type; lexical spelling remains in the source span.
    permissible_values:
      string:
        description: String.
      boolean:
        description: Boolean.
      integer:
        description: Integer.
      float:
        description: Float.
      'null':
        description: Null.
      timestamp:
        description: Timestamp.
      binary:
        description: Binary.
      custom:
        description: Custom.
  BindingRole:
    description: How a syntax node contributes to an identified domain field or retained fallback.
    permissible_values:
      named_field:
        description: A recognized domain field, including typed narrative.
      record_identity:
        description: A title, explicit ID, or another identity-bearing syntax item.
      structured_item:
        description: An explicitly authored subrecord or value.
      structural_wrapper:
        description: Tree structure or delimiters supporting named mappings.
      metadata:
        description: Document metadata with a typed syntax representation.
      extension:
        description: Unknown domain section represented by ExtensionSection.
      fallback:
        description: Uninterpreted syntax retained with an explicit reason; no claim of domain interpretation.
  BindingScope:
    description: The nodes covered by a content binding.
    permissible_values:
      node:
        description: Only the identified node.
      subtree:
        description: The node and its ordered descendants, except explicitly overridden bindings.
  ReferenceForm:
    description: Authored reference notation.
    permissible_values:
      inline_link:
        description: Inline link.
      reference_link:
        description: Reference link.
      autolink:
        description: Autolink.
      image:
        description: Image.
      footnote:
        description: Footnote.
      fragment:
        description: Fragment.
      explicit_id:
        description: Explicit id.
      quality_label:
        description: Quality label.
      subattribute_label:
        description: Sub-attribute label.
      external_locator:
        description: External locator.
  ResolutionStatus:
    description: Resolution results, not extraction/decomposition states.
    permissible_values:
      resolved:
        description: Exactly one inspected target identified.
      unresolved:
        description: An authored target was recognized but not found.
      undefined_label:
        description: A reference-style label lacks a definition, or a system's declared quality attributes lack the
          authored member label.
      unbound_label:
        description: A recognized semantic label has no governing quality attribute declaration.
      ambiguous:
        description: More than one target matches.
      external:
        description: Target is external and has not been inspected.
      out_of_scope:
        description: Target is known to be outside this snapshot scope.
      not_attempted:
        description: Resolution has not been attempted.
  LabelRole:
    description: Semantic label occurrences preserved before resolution.
    permissible_values:
      quality_classification:
        description: A requirement attribute label.
      subattribute_of:
        description: A quality attribute parent label.
  AssertionOrigin:
    description: Assertions are derived views; authored claims are represented by canonical domain fields and reference occurrences.
    permissible_values:
      derived:
        description: A declared deterministic mapping rule derives the relation from recorded source/model
          inputs.
  Severity:
    description: Diagnostic severity.
    permissible_values:
      error:
        description: Failure.
      warning:
        description: Potential issue.
      advice:
        description: Non-failing advice.
      info:
        description: Informational result.
  ForceKind:
    description: Explicitly described forces in a job progress case.
    permissible_values:
      push:
        description: Push.
      pull:
        description: Pull.
      anxiety:
        description: Anxiety.
      habit:
        description: Habit.
  SequenceMode:
    description: Only populate when explicitly authored.
    permissible_values:
      representative:
        description: An illustrative interaction order.
      required:
        description: A required order justified by an authored rule or explanation.
      partially_constrained:
        description: Only specified portions of the order are required.
  GoalLevelValue:
    description: Optional canonical interpretation of an explicitly authored goal level.
    permissible_values:
      summary:
        description: Summary or kite.
      user_task:
        description: User task or sea.
      subfunction:
        description: Subfunction or fish.
  SpecificationKind:
    description: Current dotspec document families selected for inspection.
    permissible_values:
      system:
        description: System.
      job:
        description: Job.
      quality-model:
      business-rule:
      use-case:
        description: Use case.
      concept:
        description: Concept.
      requirement:
        description: Requirement.
      quality:
        description: Quality.
  DiscoveryMode:
    description: How candidate files were discovered.
    permissible_values:
      git:
        description: Repository discovery with Git ignore rules.
      filesystem:
        description: Filesystem discovery without Git ignore rules.
      explicit:
        description: An explicit supplied file inventory.
      unavailable:
        description: Discovery policy could not be established.
  ReferenceTraversalMode:
    description: Which authored reference edges are inspected.
    permissible_values:
      none:
        description: Do not follow references.
      direct:
        description: Follow one edge from selected documents and consulted context.
      transitive:
        description: Traverse multiple edges under explicit limits; not current dotspec behavior.
  ContextSourceRole:
    description: Why a source outside the selected candidates was consulted.
    permissible_values:
      system_context:
        description: Enclosing-system context required for inspection.
      reference_target:
        description: Directly referenced target supplies link/fragment context, not another scan.
      other:
        description: Other declared context, explained by rule.
