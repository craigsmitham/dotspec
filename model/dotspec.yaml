        description: Only for resolved; target may be a domain element, source resource or source fragment.
        any_of:
        - range: DomainElement
        - range: SourceResource
        - range: SourceFragment
      candidates:
        range: Record
        description: Candidates for an ambiguous resolution.
        multivalued: true
      rule:
        range: string
        required: true
      diagnostics:
        range: Diagnostic
        multivalued: true
    rules:
    - description: A resolved occurrence names a target; target identity and type are graph checks.
      preconditions:
        slot_conditions:
          status:
            equals_string: resolved
      postconditions:
        slot_conditions:
          target:
            required: true
  Diagnostic:
    in_subset: [inspection-and-coverage]
    description: A parser, mapper, resolver, coverage or graph-check finding. It may identify a source without
      any line, element or parsed document.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Diagnostic
    attributes:
      code:
        range: string
        required: true
      severity:
        range: Severity
        required: true
      message:
        range: string
        required: true
      source:
        range: SourceDocument
      span:
        range: ByteSpan
        inlined: true
      record:
        range: Record
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      phase:
        range: string
        description: Read, parse, map, resolve, coverage or graph; retain the producing subsystem.
        required: true
      element:
        range: string
        description: Authored source element named by the native diagnostic, when available.
      related:
        range: SourceLocation
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Related native source locations, preserving their original order and optional coordinates.
  Assertion:
    in_subset: [specification-traceability]
    description: A materialized typed semantic relation with explicit provenance. Ordinary source links remain
      SourceReference occurrences and do not automatically become assertions.
    is_a: Record
    abstract: true
    attributes:
      origin:
        range: AssertionOrigin
        required: true
      mapping_rule:
        range: string
        description: Required for derived assertions; identifies deterministic semantics, not a hidden heuristic.
      inputs:
        range: Record
        description: Source occurrences and/or typed records supporting this assertion.
        multivalued: true
      source_nodes:
        range: ContentNode
        multivalued: true
      source_spans:
        range: ByteSpan
        multivalued: true
        inlined_as_list: true
    slots:
    - subject
    - object
  ParentSystem:
    in_subset: [specification-traceability]
    description: Directory-derived system containment; no semantic inheritance.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: ParentSystem
      subject:
        range: System
      object:
        range: System
    annotations:
      projection_of: System.parent_system
  OwnedBySystem:
    in_subset: [specification-traceability]
    description: Directory ownership of a specification, independent of system boundary and applicability.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: OwnedBySystem
      subject:
        range: SpecificationElement
      object:
        range: System
    annotations:
      projection_of: SpecificationElement.owning_system
  HasJobStep:
    in_subset: [specification-traceability]
    description: A job contains an explicitly authored step.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasJobStep
      subject:
        range: Job
      object:
        range: JobStep
    annotations:
      projection_of: Job.steps.steps
  HasOutcome:
    in_subset: [specification-traceability]
    description: An outcome belongs directly to a job or step.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasOutcome
      subject:
        range: DomainElement
        any_of:
        - range: Job
        - range: JobStep
      object:
        range: Outcome
    annotations:
      projection_of: Job.outcomes.outcomes or JobStep.outcomes.outcomes
  HasProgressCase:
    in_subset: [specification-traceability]
    description: A job has an explicitly authored progress case.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasProgressCase
      subject:
        range: Job
      object:
        range: ProgressCase
    annotations:
      projection_of: Job.progress_cases.cases
  HasScenario:
    in_subset: [specification-traceability]
    description: A use case has its main scenario.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasScenario
      subject:
        range: UseCase
      object:
        range: Scenario
    annotations:
      projection_of: UseCase.main_success_scenario
  HasScenarioStep:
    in_subset: [specification-traceability]
    description: A scenario or extension contains an explicit step, with source order retained on its typed
      collection.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasScenarioStep
      subject:
        range: DomainElement
        any_of:
        - range: Scenario
        - range: Extension
      object:
        range: ScenarioStep
    annotations:
      projection_of: Scenario.steps or Extension.steps
  HasExtension:
    in_subset: [specification-traceability]
    description: A use case or parent branch contains an explicitly authored extension.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasExtension
      subject:
        range: DomainElement
        any_of:
        - range: UseCase
        - range: Extension
      object:
        range: Extension
    annotations:
      projection_of: UseCase.extensions.branches or Extension.branches
  HasConceptAction:
    in_subset: [specification-traceability]
    description: A concept declares an explicit action.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasConceptAction
      subject:
        range: Concept
      object:
        range: ConceptAction
    annotations:
      projection_of: Concept.actions.actions
  DeclaresQualityAttribute:
    in_subset: [specification-traceability]
    description: A system or reusable quality model declares and owns a quality attribute.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: DeclaresQualityAttribute
      subject:
        range: SpecificationElement
        any_of:
        - range: System
        - range: QualityModel
      object:
        range: QualityAttribute
    annotations:
      projection_of: System.quality_attributes or QualityModel.quality_attributes
  SubattributeOf:
    in_subset: [specification-traceability]
    description: An explicitly authored and resolved attribute grouping; it does not imply exclusive decomposition or inherited obligations.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: SubattributeOf
      subject:
        range: QualityAttribute
      object:
        range: QualityAttribute
    annotations:
      projection_of: QualityAttribute.subattribute_of
  QualityClassification:
    in_subset: [specification-traceability]
    description: A requirement is explicitly classified by a resolved quality attribute.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: QualityClassification
      subject:
        range: Requirement
      object:
        range: QualityAttribute
    annotations:
      projection_of: Requirement.attributes
  SupportsJob:
    in_subset: [specification-traceability]
    description: An explicitly authored semantic support relation; a Related jobs link alone is insufficient.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: SupportsJob
      subject:
        range: UseCase
      object:
        range: DomainElement
        any_of:
        - range: Job
        - range: JobStep
        - range: Outcome
  AppliesTo:
    in_subset: [specification-traceability]
    description: An explicitly authored applicability relation to a domain element; links remain citations
      unless meaning is explicit.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: AppliesTo
      subject:
        range: Requirement
      object:
        range: DomainElement
  BoundaryIs:
    in_subset: [specification-traceability]
    description: An explicitly identified and resolved system boundary, never derived from directory ownership.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: BoundaryIs
      subject:
        range: UseCase
      object:
        range: System
  DiscoveryPolicy:
    in_subset: [inspection-and-coverage]
    description: Recorded discovery bounds. Current dotspec uses git or filesystem mode and excludes symlinks
      and nested repositories.
    attributes:
      mode:
        range: DiscoveryMode
        required: true
      rule:
        range: string
        description: Versioned discovery policy identifier.
        required: true
      follow_symlinks:
        range: boolean
        required: true
      include_nested_repositories:
        range: boolean
        required: true
  ReferenceTraversal:
    in_subset: [inspection-and-coverage]
    description: Recorded reference traversal, independent of file discovery and domain semantic relations.
    attributes:
      mode:
        range: ReferenceTraversalMode
        required: true
      include_system_context:
        range: boolean
        required: true
      follow_external_resources:
        range: boolean
        required: true
      repository_bounded:
        range: boolean
        required: true
      maximum_depth:
        range: integer
        minimum_value: 0
      rule:
        range: string
        required: true
  ContextSource:
    in_subset: [inspection-and-coverage]
    description: A consulted context source and the reason it entered the snapshot.
    attributes:
      source:
        range: SourceDocument
        required: true
      role:
        range: ContextSourceRole
        required: true
      requested_by:
        range: SourceDocument
        multivalued: true
      reference_occurrences:
        range: SourceReference
        multivalued: true
      rule:
        range: string
        required: true
  SourceRevision:
    in_subset: [source-artifacts]
    description: Optional known source-revision context, without claiming a clean working tree or immutable
      path.
    attributes:
      version_system:
        range: string
        description: For example git, a versioned object store or an archive.
        required: true
      repository_locator:
        range: string
      revision:
        range: string
        description: Known source revision or base revision.
        required: true
      working_copy_modified:
        range: boolean
        description: Omit when unknown; payload digest identifies the observed bytes regardless.
  SourceDirectory:
    in_subset: [source-artifacts]
    description: An addressable local directory referenced by Markdown. It is a resource target, not a document
      and has no source payload.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDirectory
    attributes:
      locator:
        range: string
        required: true
  SourceLocation:
    in_subset: [source-artifacts]
    description: A diagnostic source location, including path-only or external-to-snapshot locations without
      invented coordinates.
    attributes:
      source:
        range: SourceDocument
      locator:
        range: string
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      element:
        range: string
      span:
        range: ByteSpan
        inlined: true
  OpenDecisionCollection:
    in_subset: [business-requirements, user-requirements, software-requirements]
    description: Open-decision section narrative and explicitly distinguished question/evidence entries.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      decisions:
        range: OpenDecision
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
slots:
  id:
    range: string
    description: Required snapshot-local record identity; does not require a globally stable authored ID.
    required: true
    identifier: true
    pattern: '[\s\S]+'
  kind:
    range: string
    description: Concrete record type discriminator.
    required: true
  authored_id:
    range: string
    description: An explicitly authored ID when present; no manufactured global identifier.
  subject:
    range: DomainElement
    required: true
  object:
    range: DomainElement
    required: true
enums:
  ReadStatus:
    description: Whether original source bytes were acquired.
    permissible_values:
      read:
        description: Original bytes acquired.
      failed:
        description: Read attempted but failed; diagnostic retained.
      not_attempted:
        description: Source discovered but not read.
  ParseStatus:
    description: Syntax or frontmatter parse state, independent of domain decomposition.
    permissible_values:
      parsed:
        description: Supported syntax parsed; opaque unsupported syntax may still exist.
      partial:
        description: Some syntax parsed and some malformed or uninterpreted.
      failed:
        description: Parsing failed; original bytes and opaque content remain available.
      not_attempted:
        description: No syntax parse attempted.
  Presence:
    description: Presence of an authored field; omission of the containing slot means absent.
    permissible_values:
      empty:
        description: The field or section is explicitly present without body content.
      authored:
        description: The field contains authored content, including placeholders or unknown statements.
  DecompositionStatus:
    description: Optional explicit internal structure, not prose truth or completeness.
    permissible_values:
      not_attempted:
        description: No structural decomposition attempted.
      unsegmented:
        description: Retained as typed narrative; no finer structure was authored or recognized.
      partial:
        description: Some explicit items mapped; remaining content is retained.
      complete:
        description: All recognized explicit structures within the declared mapping scope mapped.
      failed:
        description: Decomposition attempted but failed; narrative remains retained.
  CoverageStatus:
    description: Checked named-domain mapping status. Syntax retention alone is insufficient.
    permissible_values:
      not_checked:
        description: Coverage has not been checked.
      partial:
        description: Known domain roles remain unmapped or mapping errors exist.
      complete_for_profile:
        description: All known roles in the declared mapping profile are mapped; unknown extensions remain
          explicitly reported.
  PayloadStorage:
    description: Where the exact original bytes can be recovered.
    permissible_values:
      inline_base64:
        description: bytes_base64 stores original bytes including BOM and line endings.
      external:
        description: An immutable payload locator plus digest addresses original bytes; a mutable repository
          path alone is insufficient.
  NodeKind:
    description: Ordered source syntax tree kinds, including metadata and opaque fallback.
    permissible_values:
      document:
        description: Document.
      frontmatter:
        description: Frontmatter.
      heading:
        description: Heading.
      paragraph:
        description: Paragraph.
      list:
        description: List.
      list_item:
        description: List item.
      block_quote:
        description: Block quote.
      fenced_code:
        description: Fenced code.
      indented_code:
        description: Indented code.
      thematic_break:
        description: Thematic break.
      html_block:
        description: Html block.
      table:
        description: Table.
      table_row:
        description: Table row.
      table_cell:
        description: Table cell.
      link_definition:
        description: Link definition.
      footnote_definition:
        description: Footnote definition.
      text:
        description: Text.
      emphasis:
        description: Emphasis.
      strong:
        description: Strong.
      strikethrough:
        description: Strikethrough.
      link:
        description: Link.
      image:
        description: Image.
      autolink:
        description: Autolink.
      code_span:
        description: Code span.
      soft_break:
        description: Soft break.
      hard_break:
        description: Hard break.
      inline_html:
        description: Inline html.
      footnote_reference:
        description: Footnote reference.
      escape:
        description: Escape.
      entity:
        description: Entity.
      yaml_mapping:
        description: Yaml mapping.
      yaml_entry:
        description: Yaml entry.
      yaml_sequence:
        description: Yaml sequence.
      yaml_scalar:
        description: Yaml scalar.
      yaml_alias:
        description: Yaml alias.
      yaml_anchor:
        description: Yaml anchor.
      comment:
        description: Comment.
      trivia:
        description: Trivia.
      opaque:
        description: Opaque.
      section:
        description: An explicitly grouped heading and its ordered body/subsections; grouping follows a declared
          outline mapping.
  ScalarKind:
    description: Interpreted metadata scalar type; lexical spelling remains in the source span.
    permissible_values:
      string:
        description: String.
      boolean:
        description: Boolean.
      integer:
        description: Integer.
      float:
        description: Float.
      'null':
        description: Null.
      timestamp:
        description: Timestamp.
      binary:
        description: Binary.
      custom:
        description: Custom.
  BindingRole:
    description: How a syntax node contributes to an identified domain field or retained fallback.
    permissible_values:
      named_field:
        description: A recognized domain field, including typed narrative.
      record_identity:
        description: A title, explicit ID, or another identity-bearing syntax item.
      structured_item:
        description: An explicitly authored subrecord or value.
      structural_wrapper:
        description: Tree structure or delimiters supporting named mappings.
      metadata:
        description: Document metadata with a typed syntax representation.
      extension:
        description: Unknown domain section represented by ExtensionSection.
      fallback:
        description: Uninterpreted syntax retained with an explicit reason; no claim of domain interpretation.
  BindingScope:
    description: The nodes covered by a content binding.
    permissible_values:
      node:
        description: Only the identified node.
      subtree:
        description: The node and its ordered descendants, except explicitly overridden bindings.
  ReferenceForm:
    description: Authored reference notation.
    permissible_values:
      inline_link:
        description: Inline link.
      reference_link:
        description: Reference link.
      autolink:
        description: Autolink.
      image:
        description: Image.
      footnote:
        description: Footnote.
      fragment:
        description: Fragment.
      explicit_id:
        description: Explicit id.
      quality_label:
        description: Quality label.
      subattribute_label:
        description: Sub-attribute label.
      external_locator:
        description: External locator.
  ResolutionStatus:
    description: Resolution results, not extraction/decomposition states.
    permissible_values:
      resolved:
        description: Exactly one inspected target identified.
      unresolved:
        description: An authored target was recognized but not found.
      undefined_label:
        description: A reference-style label lacks a definition, or a system's declared quality attributes lack the
          authored member label.
      unbound_label:
        description: A recognized semantic label has no governing quality attribute declaration.
      ambiguous:
        description: More than one target matches.
      external:
        description: Target is external and has not been inspected.
      out_of_scope:
        description: Target is known to be outside this snapshot scope.
      not_attempted:
        description: Resolution has not been attempted.
  LabelRole:
    description: Semantic label occurrences preserved before resolution.
    permissible_values:
      quality_classification:
        description: A requirement attribute label.
      subattribute_of:
        description: A quality attribute parent label.
  AssertionOrigin:
    description: Evidence for a materialized semantic relation.
    permissible_values:
      authored:
        description: An explicit semantic relation in supported source syntax.
      derived:
        description: A declared deterministic mapping rule derives the relation from recorded source/model
          inputs.
  Severity:
    description: Diagnostic severity.
    permissible_values:
      error:
        description: Failure.
      warning:
        description: Potential issue.
      advice:
        description: Non-failing advice.
      info:
        description: Informational result.
  ForceKind:
    description: Explicitly described forces in a job progress case.
    permissible_values:
      push:
        description: Push.
      pull:
        description: Pull.
      anxiety:
        description: Anxiety.
      habit:
        description: Habit.
  SequenceMode:
    description: Only populate when explicitly authored.
    permissible_values:
      representative:
        description: An illustrative interaction order.
      required:
        description: A required order justified by an authored rule or explanation.
      partially_constrained:
        description: Only specified portions of the order are required.
  GoalLevelValue:
    description: Optional canonical interpretation of an explicitly authored goal level.
    permissible_values:
      summary:
        description: Summary or kite.
      user_task:
        description: User task or sea.
      subfunction:
        description: Subfunction or fish.
  SpecificationKind:
    description: Current dotspec document families selected for inspection.
    permissible_values:
      system:
        description: System.
      job:
        description: Job.
      quality-model:
      business-rule:
      use-case:
        description: Use case.
      concept:
        description: Concept.
      requirement:
        description: Requirement.
      quality:
        description: Quality.
  DiscoveryMode:
    description: How candidate files were discovered.
    permissible_values:
      git:
        description: Repository discovery with Git ignore rules.
      filesystem:
        description: Filesystem discovery without Git ignore rules.
      explicit:
        description: An explicit supplied file inventory.
      unavailable:
        description: Discovery policy could not be established.
  ReferenceTraversalMode:
    description: Which authored reference edges are inspected.
    permissible_values:
      none:
        description: Do not follow references.
      direct:
        description: Follow one edge from selected documents and consulted context.
      transitive:
        description: Traverse multiple edges under explicit limits; not current dotspec behavior.
  ContextSourceRole:
    description: Why a source outside the selected candidates was consulted.
    permissible_values:
      system_context:
        description: Enclosing-system context required for inspection.
      reference_target:
        description: Directly referenced target supplies link/fragment context, not another scan.
      other:
        description: Other declared context, explained by rule.
