          relationship_scope: "Requirement for a quality-classification label, or QualityAttribute for a sub-attribute label; retained in the corresponding occurrence list."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "Requirement.attribute_labels or QualityAttribute.subattribute_of_labels"
          relationship_ordering: "single target"
      role:
        range: LabelRole
        required: true
      label:
        range: string
        required: true
      content_node:
        range: ContentNode
        required: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      resolution:
        range: Resolution
        annotations:
          relationship_category: "provenance"
          relationship_scope: "A resolution for this exact authored label occurrence; reciprocal pointers must agree."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "Resolution.occurrence"
          relationship_ordering: "single target"
      system_context:
        range: System
        description: System in whose scope this label was interpreted, if established.
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      quality_model_context:
        range: QualityModel
        description: Declaring model for parent labels on reusable definitions; never used for requirement classification.
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
  Resolution:
    in_subset: [specification-traceability]
    description: The recorded outcome of resolving one authored reference or label; targets need not be domain
      entities.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Resolution
    attributes:
      occurrence:
        range: Record
        required: true
        any_of:
        - range: SourceReference
        - range: LabelOccurrence
        annotations:
          relationship_category: "provenance"
          relationship_scope: "The authored occurrence whose resolution points back to this record."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "SourceReference.resolution or LabelOccurrence.resolution"
          relationship_ordering: "single target"
      status:
        range: ResolutionStatus
        required: true
      target:
        range: Record
        description: Only for resolved; target may be a domain element, source resource or source fragment.
        any_of:
        - range: DomainElement
        - range: SourceResource
        - range: SourceFragment
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      candidates:
        range: Record
        description: Candidates for an ambiguous resolution.
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
      rule:
        range: string
        required: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
    rules:
    - description: A resolved occurrence names a target; target identity and type are graph checks.
      preconditions:
        slot_conditions:
          status:
            equals_string: resolved
      postconditions:
        slot_conditions:
          target:
            required: true
  Diagnostic:
    in_subset: [inspection-and-coverage]
    description: A parser, mapper, resolver, coverage or graph-check finding. It may identify a source without
      any line, element or parsed document.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Diagnostic
    attributes:
      code:
        range: string
        required: true
      severity:
        range: Severity
        required: true
      message:
        range: string
        required: true
      source:
        range: SourceDocument
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      span:
        range: ByteSpan
        inlined: true
      record:
        range: Record
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      phase:
        range: string
        description: Read, parse, map, resolve, coverage or graph; retain the producing subsystem.
        required: true
      element:
        range: string
        description: Authored source element named by the native diagnostic, when available.
      related:
        range: SourceLocation
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Related native source locations, preserving their original order and optional coordinates.
  Assertion:
    in_subset: [specification-traceability]
    description: An optional derived relationship view of canonical typed fields, with required endpoints and explicit provenance. Ordinary source links remain
      SourceReference occurrences and do not automatically become assertions.
    is_a: Record
    abstract: true
    attributes:
      projection_path:
        required: true
        range: string
        description: Canonical Class.field.path for a derived relationship view; preserves its role when several fields share an assertion kind.
      origin:
        range: AssertionOrigin
        required: true
      mapping_rule:
        range: string
        description: Required for derived assertions; identifies deterministic semantics, not a hidden heuristic.
      inputs:
        range: Record
        description: Source occurrences and/or typed records supporting this assertion.
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
      source_nodes:
        range: ContentNode
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
      source_spans:
        range: ByteSpan
        multivalued: true
        inlined_as_list: true
    slots:
    - subject
    - object
  Supports:
    in_subset:
    - specification-traceability
    description: Intended contribution, not achievement.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: Supports
      subject:
        range: TraceableElement
      object:
        range: Record
        any_of:
        - range: SystemGoal
        - range: Job
        - range: JobStep
        - range: Outcome
    annotations:
      projection_of: TraceableElement.supports
  DerivedFrom:
    in_subset:
    - specification-traceability
    description: Explicit basis, not logical entailment.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: DerivedFrom
      subject:
        range: TraceableElement
      object:
        range: Record
        any_of:
        - range: DomainElement
        - range: SourceFragment
    annotations:
      projection_of: TraceableElement.derived_from
  ReliesOn:
    in_subset:
    - specification-traceability
    description: Conditional validity under an assumption.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: ReliesOn
      subject:
        range: TraceableElement
      object:
        range: Assumption
    annotations:
      projection_of: TraceableElement.relies_on
  Refines:
    in_subset:
    - specification-traceability
    description: More precise obligation preserving its parent commitment.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: Refines
      subject:
        range: TraceableElement
      object:
        range: Record
        any_of:
        - range: Requirement
        - range: BusinessRule
        - range: ObligationClause
    annotations:
      projection_of: Requirement.refines or BusinessRule.refines or ObligationClause.refines
  Involves:
    in_subset:
    - specification-traceability
    description: Participation in an actor-goal interaction.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: Involves
      subject:
        range: UseCase
      object:
        range: ConceptUse
    annotations:
      projection_of: UseCase.involves
  HasObligation:
    in_subset:
    - specification-traceability
    description: Explicitly distinguished obligation expression.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasObligation
      subject:
        range: TraceableElement
      object:
        range: ObligationClause
    annotations:
      projection_of: TraceableElement.obligations
  ParentSystem:
    in_subset: [specification-traceability]
    description: Directory-derived system containment; no semantic inheritance.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: ParentSystem
      subject:
        range: System
      object:
        range: System
    annotations:
      projection_of: System.parent_system
  InSystemContext:
    in_subset: [specification-traceability]
    description: Directory-derived context of a specification, independent of system boundary and applicability.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: InSystemContext
      subject:
        range: SystemContextSpecification
      object:
        range: System
    annotations:
      projection_of: SystemContextSpecification.system_context
  HasJobStep:
    in_subset: [specification-traceability]
    description: A job contains an explicitly authored step.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasJobStep
      subject:
        range: Job
      object:
        range: JobStep
    annotations:
      projection_of: Job.steps.steps
  HasOutcome:
    in_subset: [specification-traceability]
    description: An outcome belongs directly to a job or step.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasOutcome
      subject:
        range: DomainElement
        any_of:
        - range: Job
        - range: JobStep
      object:
        range: Outcome
    annotations:
      projection_of: Job.outcomes.outcomes or JobStep.outcomes.outcomes
  HasProgressCase:
    in_subset: [specification-traceability]
    description: A job has an explicitly authored progress case.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasProgressCase
      subject:
        range: Job
      object:
        range: ProgressCase
    annotations:
      projection_of: Job.progress_cases.cases
  HasScenario:
    in_subset: [specification-traceability]
    description: A use case has its main scenario.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasScenario
      subject:
        range: UseCase
      object:
        range: Scenario
    annotations:
      projection_of: UseCase.main_success_scenario
  HasScenarioStep:
    in_subset: [specification-traceability]
    description: A scenario or extension contains an explicit step, with source order retained on its typed
      collection.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasScenarioStep
      subject:
        range: DomainElement
        any_of:
        - range: Scenario
        - range: Extension
      object:
        range: ScenarioStep
    annotations:
      projection_of: Scenario.steps or Extension.steps
  HasExtension:
    in_subset: [specification-traceability]
    description: A use case or parent branch contains an explicitly authored extension.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasExtension
      subject:
        range: DomainElement
        any_of:
        - range: UseCase
        - range: Extension
      object:
        range: Extension
    annotations:
      projection_of: UseCase.extensions.branches or Extension.branches
  HasConceptAction:
    in_subset: [specification-traceability]
    description: A concept declares an explicit action.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasConceptAction
      subject:
        range: Concept
      object:
        range: ConceptAction
    annotations:
      projection_of: Concept.actions.actions
  UsesConcept:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared ConceptUse.definition relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: UsesConcept
      subject:
        range: ConceptUse
      object:
        range: Concept
    annotations:
      projection_of: ConceptUse.definition
  HasConceptUse:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared System.concept_uses relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasConceptUse
      subject:
        range: System
      object:
        range: ConceptUse
    annotations:
      projection_of: System.concept_uses
  HasSynchronization:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared System.synchronizations relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasSynchronization
      subject:
        range: System
      object:
        range: Synchronization
    annotations:
      projection_of: System.synchronizations
  ConceptDependency:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared ConceptUse.dependencies relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: ConceptDependency
      subject:
        range: ConceptUse
      object:
        range: ConceptUse
    annotations:
      projection_of: ConceptUse.dependencies
  HasConceptType:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared Concept.type_parameters or Concept.introduced_types relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasConceptType
      subject:
        range: Concept
      object:
        range: ConceptType
    annotations:
      projection_of: Concept.type_parameters or Concept.introduced_types
  HasTypeBinding:
    in_subset: [specification-traceability]
    description: Projection of the explicitly declared ConceptUse.bindings relationship.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: HasTypeBinding
      subject:
        range: ConceptUse
      object:
        range: TypeBinding
    annotations:
      projection_of: ConceptUse.bindings
  DeclaresQualityAttribute:
    in_subset: [specification-traceability]
    description: A system or reusable quality model declares and owns a quality attribute.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: DeclaresQualityAttribute
      subject:
        range: SpecificationElement
        any_of:
        - range: System
        - range: QualityModel
      object:
        range: QualityAttribute
    annotations:
      projection_of: System.quality_attributes or QualityModel.quality_attributes
  SubattributeOf:
    in_subset: [specification-traceability]
    description: An explicitly authored and resolved attribute grouping; it does not imply exclusive decomposition or inherited obligations.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: SubattributeOf
      subject:
        range: QualityAttribute
      object:
        range: QualityAttribute
    annotations:
      projection_of: QualityAttribute.subattribute_of
  QualityClassification:
    in_subset: [specification-traceability]
    description: A requirement is explicitly classified by a resolved quality attribute.
    is_a: Assertion
    slot_usage:
      kind:
        equals_string: QualityClassification
      subject:
        range: Requirement
      object:
        range: QualityAttribute
    annotations:
      projection_of: Requirement.attributes
  SupportsJob:
    in_subset: [specification-traceability]
    description: An explicitly authored semantic support relation; a Related jobs link alone is insufficient.
    is_a: Assertion
    annotations:
      projection_of: UseCase.supported_jobs
    slot_usage:
      kind:
        equals_string: SupportsJob
      subject:
        range: UseCase
      object:
        range: DomainElement
        any_of:
        - range: Job
        - range: JobStep
        - range: Outcome
  AppliesTo:
    in_subset:
    - specification-traceability
    description: An explicitly authored applicability relation to a domain element; links remain citations unless
      meaning is explicit.
    is_a: Assertion
    annotations:
      projection_of: Requirement.applicability_targets or BusinessRule.applicability_targets or ObligationClause.applicability_targets
    slot_usage:
      kind:
        equals_string: AppliesTo
      subject:
        range: SystemContextSpecification
        any_of:
        - range: Requirement
        - range: BusinessRule
        - range: ObligationClause
      object:
        range: DomainElement
  BoundaryIs:
    in_subset: [specification-traceability]
    description: An explicitly identified and resolved system boundary, never derived from directory ownership.
    is_a: Assertion
    annotations:
      projection_of: UseCase.boundary
    slot_usage:
      kind:
        equals_string: BoundaryIs
      subject:
        range: UseCase
      object:
        range: System
  DiscoveryPolicy:
    in_subset: [inspection-and-coverage]
    description: Recorded discovery bounds. Current dotspec uses git or filesystem mode and excludes symlinks
      and nested repositories.
    attributes:
      mode:
        range: DiscoveryMode
        required: true
      rule:
        range: string
        description: Versioned discovery policy identifier.
        required: true
      follow_symlinks:
        range: boolean
        required: true
      include_nested_repositories:
        range: boolean
        required: true
  ReferenceTraversal:
    in_subset: [inspection-and-coverage]
    description: Recorded reference traversal, independent of file discovery and domain semantic relations.
    attributes:
      mode:
        range: ReferenceTraversalMode
        required: true
      include_system_context:
        range: boolean
        required: true
      follow_external_resources:
        range: boolean
        required: true
      repository_bounded:
        range: boolean
        required: true
      maximum_depth:
        range: integer
        minimum_value: 0
      rule:
        range: string
        required: true
  ContextSource:
    in_subset: [inspection-and-coverage]
    description: A consulted context source and the reason it entered the snapshot.
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      role:
        range: ContextSourceRole
        required: true
      requested_by:
        range: SourceDocument
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
      reference_occurrences:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "unordered"
      rule:
        range: string
        required: true
  SourceRevision:
    in_subset: [source-artifacts]
    description: Optional known source-revision context, without claiming a clean working tree or immutable
      path.
    attributes:
      version_system:
        range: string
        description: For example git, a versioned object store or an archive.
        required: true
      repository_locator:
        range: string
      revision:
        range: string
        description: Known source revision or base revision.
        required: true
      working_copy_modified:
        range: boolean
        description: Omit when unknown; payload digest identifies the observed bytes regardless.
  SourceDirectory:
    in_subset: [source-artifacts]
    description: An addressable local directory referenced by Markdown. It is a resource target, not a document
      and has no source payload.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDirectory
    attributes:
      locator:
        range: string
        required: true
  SourceLocation:
    in_subset: [source-artifacts]
    description: A diagnostic source location, including path-only or external-to-snapshot locations without
      invented coordinates.
    attributes:
      source:
        range: SourceDocument
        annotations:
          relationship_category: "provenance"
          relationship_scope: "Records in this snapshot; source locations retain their original document scope."
          relationship_cycles: "not-applicable"
          relationship_basis: "Recorded source or inspection evidence."
          relationship_inverse: "none"
          relationship_ordering: "single target"
      locator:
        range: string
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      element:
        range: string
      span:
        range: ByteSpan
        inlined: true
  OpenDecisionCollection:
    in_subset: [business-requirements, user-requirements, software-requirements]
    description: Open-decision section narrative and explicitly distinguished question/evidence entries.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      decisions:
        range: OpenDecision
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
slots:
  id:
    range: string
    description: Required snapshot-local record identity; does not require a globally stable authored ID.
    required: true
    identifier: true
    pattern: '[\s\S]+'
  kind:
    range: string
    description: Concrete record type discriminator.
    required: true
  authored_id:
    range: string
    description: An explicitly authored ID when present; no manufactured global identifier.
  subject:
    range: DomainElement
    required: true
    annotations:
      relationship_category: "derived-projection"
      relationship_scope: "Typed endpoints of the canonical relationship identified by projection_path."
      relationship_cycles: "not-applicable"
      relationship_basis: "Deterministic projection; assertions are optional views."
      relationship_inverse: "none"
      relationship_ordering: "single target"
  object:
    range: DomainElement
    required: true
    annotations:
      relationship_category: "derived-projection"
      relationship_scope: "Typed endpoints of the canonical relationship identified by projection_path."
      relationship_cycles: "not-applicable"
      relationship_basis: "Deterministic projection; assertions are optional views."
      relationship_inverse: "none"
      relationship_ordering: "single target"
enums:
  ReadStatus:
    description: Whether original source bytes were acquired.
    permissible_values:
      read:
        description: Original bytes acquired.
      failed:
        description: Read attempted but failed; diagnostic retained.
      not_attempted:
        description: Source discovered but not read.
  ParseStatus:
    description: Syntax or frontmatter parse state, independent of domain decomposition.
    permissible_values:
      parsed:
        description: Supported syntax parsed; opaque unsupported syntax may still exist.
      partial:
        description: Some syntax parsed and some malformed or uninterpreted.
      failed:
        description: Parsing failed; original bytes and opaque content remain available.
      not_attempted:
        description: No syntax parse attempted.
  Presence:
    description: Presence of an authored field; omission of the containing slot means absent.
    permissible_values:
      empty:
        description: The field or section is explicitly present without body content.
      authored:
        description: The field contains authored content, including placeholders or unknown statements.
  DecompositionStatus:
    description: Optional explicit internal structure, not prose truth or completeness.
    permissible_values:
      not_attempted:
        description: No structural decomposition attempted.
      unsegmented:
        description: Retained as typed narrative; no finer structure was authored or recognized.
      partial:
        description: Some explicit items mapped; remaining content is retained.
      complete:
        description: All recognized explicit structures within the declared mapping scope mapped.
      failed:
        description: Decomposition attempted but failed; narrative remains retained.
  CoverageStatus:
    description: Checked named-domain mapping status. Syntax retention alone is insufficient.
    permissible_values:
      not_checked:
        description: Coverage has not been checked.
      partial:
        description: Known domain roles remain unmapped or mapping errors exist.
      complete_for_profile:
        description: All known roles in the declared mapping profile are mapped; unknown extensions remain
          explicitly reported.
  PayloadStorage:
    description: Where the exact original bytes can be recovered.
    permissible_values:
      inline_base64:
        description: bytes_base64 stores original bytes including BOM and line endings.
      external:
        description: An immutable payload locator plus digest addresses original bytes; a mutable repository
          path alone is insufficient.
  NodeKind:
    description: Ordered source syntax tree kinds, including metadata and opaque fallback.
    permissible_values:
      document:
        description: Document.
      frontmatter:
        description: Frontmatter.
      heading:
        description: Heading.
      paragraph:
        description: Paragraph.
      list:
        description: List.
      list_item:
        description: List item.
      block_quote:
        description: Block quote.
      fenced_code:
        description: Fenced code.
      indented_code:
        description: Indented code.
      thematic_break:
        description: Thematic break.
      html_block:
        description: Html block.
      table:
        description: Table.
      table_row:
        description: Table row.
      table_cell:
        description: Table cell.
      link_definition:
        description: Link definition.
      footnote_definition:
        description: Footnote definition.
