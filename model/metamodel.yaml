        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: supports_content
      supports:
        range: DomainElement
        multivalued: true
        description: Intended contribution to a goal, user progress or a higher-level use case; does not assert
          achievement.
        annotations:
          relationship_category: semantic-association
          trace_heading: Supports
          trace_targets: Goal or Job or JobStep or DesiredOutcome or UseCase
          requires_content: supports_content
        any_of:
        - range: Goal
        - range: Job
        - range: JobStep
        - range: DesiredOutcome
        - range: UseCase
      derived_from_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      derived_from_references:
        range: SourceReference
