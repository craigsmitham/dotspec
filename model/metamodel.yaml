          not redefine the obligation's applicability or criterion conditions.
      procedure:
        range: RichContent
        inlined: true
      evidence_to_retain:
        range: RichContent
        inlined: true
      workload:
        range: RichContent
        inlined: true
        description: Workload used to collect observations and how it represents the required workload.
      population:
        range: RichContent
        inlined: true
        description: Observed or sampled population and how it represents the population covered by the obligation.
      exclusions:
        range: RichContent
        inlined: true
        description: Exclusions from evidence collection or analysis; justify their relationship to the
          obligation's scope rather than silently narrowing it.
