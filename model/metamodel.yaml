id: https://github.com/craigsmitham/dotspec/model/metamodel.yaml
name: dotspec_metamodel
title: Dotspec specification metamodel
version: 0.27.0-draft
description: Experimental first-class metamodel for source-backed specification snapshots. The exported model
  is distinct from Markdown authoring checks. Source fidelity, syntax interpretation, named domain mapping,
  and optional structured decomposition are separate concerns. Existing prose is valid domain content; fields
  and relationships are populated only by explicit syntax or a declared mapping rule, never by unrecorded NLP
  inference. Raw source alone does not establish domain coverage.
prefixes:
  ds: https://github.com/craigsmitham/dotspec/model/
  linkml: https://w3id.org/linkml/
default_prefix: ds
default_range: string
imports:
- linkml:types
annotations:
  status: experimental
  runtime_target: Generated JSON Schema plus explicit graph checks; no generated-Go reliance.
  graph_rules: Identifier uniqueness; referential integrity and typed endpoints; containment ownership and
    cycle rules; normalized Markdown and span bounds; ordered syntax-tree and membership consistency;
    complete content-binding accounting; scope and resolution consistency; owner-local attribute identity/subattribute_of
    cycles; paired declarations and section content; honest optional decomposition; assertion provenance and
    agreement with canonical fields are explicit graph checks, not implied by JSON Schema generation.
  relationship_defaults: 'Relationship fields name a RelationshipCategory. Its scope, cycle policy and basis
    apply unless a field states its own. An unstated inverse is none, an unstated label is the field name,
    and unstated ordering follows the field shape: single target, authored presentation order for ordered lists,
    otherwise unordered.'
subsets:
  business-requirements:
    title: Business requirements
    description: Business objectives, scope, assumptions, and rules governing permissible business activity.
    annotations:
      classification: core
  user-requirements:
    title: User requirements
    description: The progress people seek, their circumstances, work, and desired outcomes.
    annotations:
      classification: core
  software-requirements:
    title: Software requirements
    description: Software interactions, concept behavior, obligations, quality classifications and satisfaction criteria.
    annotations:
      classification: core
  specification-traceability:
    title: Specification traceability
    description: Explicit connections between specification meaning, authored occurrences, and resolved relationships.
    annotations:
      classification: core
  specification-documentation:
    title: Specification documentation
    description: Roles, reader-facing content, and navigation of generated requirements documents.
    annotations:
      classification: supporting
  inspection-and-coverage:
    title: Inspection and coverage
    description: The scope, completion, diagnostics, and mapping coverage of an inspection.
    annotations:
      classification: supporting
  document-content:
    title: Document content
    description: Ordered document syntax, rich text, and preserved extension content.
    annotations:
      classification: generic
  source-artifacts:
    title: Source artifacts
    description: Source identities, normalized Markdown, fragments, and locations.
    annotations:
      classification: generic
classes:
  GeneratedDocument:
    abstract: true
    in_subset: [specification-documentation]
    description: A reader-facing document rendered as a Markdown page or an addressable section.
    attributes:
      type:
        required: true
        range: string
        description: Serialized document type fixed by the concrete class.
  SubjectSpecReport:
    abstract: true
    is_a: GeneratedDocument
    in_subset: [specification-documentation]
    description: The canonical generated account of one addressable subject in the selected snapshot.
    attributes:
      documents:
        required: true
        range: DomainElement
        description: The documented subject, serialized as a relative URI to its authored heading.
        annotations:
          relationship_category: semantic-association
          relationship_scope: One selected subject of the concrete document's corresponding domain class.
          relationship_basis: Identity of the domain record mapped from the referenced heading.
  SystemSpecReport:
    is_a: SubjectSpecReport
    description: Explains the system’s purpose and scope and links to its immediate child systems, local subjects, and obligations.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: system-spec-report
      documents:
        range: System
  RequirementSpecReport:
    is_a: SubjectSpecReport
    description: Brings the requirement statement, applicability and criterion together at one address.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: requirement-spec-report
      documents:
        range: Requirement
  ComponentSpecReport:
    is_a: SubjectSpecReport
    description: Explains the component’s responsibilities and links to its structural children, declared interfaces, and explicitly applicable requirements.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: component-spec-report
      documents:
        range: Component
  FeatureSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: feature-spec-report
      documents:
        range: Feature
  CapabilitySpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: capability-spec-report
      documents:
        range: Capability
  ConceptUseSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-use-spec-report
      documents:
        range: ConceptUse
  InterfaceSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: interface-spec-report
      documents:
        range: Interface
  SynchronizationSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: synchronization-spec-report
      documents:
        range: Synchronization
  QualityModelSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: quality-model-spec-report
      documents:
        range: QualityModel
  BusinessRuleSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: business-rule-spec-report
      documents:
        range: BusinessRule
  JobSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: job-spec-report
      documents:
        range: Job
  UseCaseSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: use-case-spec-report
      documents:
        range: UseCase
  ConceptSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-spec-report
      documents:
        range: Concept
  QualityAttributeSpecReport:
    is_a: SubjectSpecReport
    description: Defines one quality attribute and links to the requirements classified by it.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: quality-attribute-spec-report
      documents:
        range: QualityAttribute
  ObligationClauseSpecReport:
    is_a: SubjectSpecReport
    description: Preserves an addressable promise within the interaction or other subject that declares it.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: obligation-clause-spec-report
      documents:
        range: ObligationClause
  GoalSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: goal-spec-report
      documents:
        range: Goal
  AssumptionSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: assumption-spec-report
      documents:
        range: Assumption
  GlossaryTermSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: glossary-term-spec-report
      documents:
        range: GlossaryTerm
  ScenarioSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: scenario-spec-report
      documents:
        range: Scenario
  UseCaseExtensionSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: use-case-extension-spec-report
      documents:
        range: UseCaseExtension
  JobStepSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: job-step-spec-report
      documents:
        range: JobStep
  DesiredOutcomeSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: desired-outcome-spec-report
      documents:
        range: DesiredOutcome
  ConceptActionSpecReport:
    is_a: SubjectSpecReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-action-spec-report
      documents:
        range: ConceptAction
  Record:
    in_subset:
    - source-artifacts
    description: An addressable record in one snapshot. All IDs are unique across snapshot collections.
    abstract: true
    attributes:
      id:
        range: string
        description: Required snapshot-local record identity; does not require a globally stable authored ID.
        required: true
        identifier: true
        pattern: '[\s\S]+'
      kind:
        range: string
        description: Concrete record type discriminator.
        required: true
  Snapshot:
    in_subset:
    - inspection-and-coverage
    description: A bounded and potentially incomplete observation of source documents and their mapped domain
      content.
    attributes:
      model_version:
        range: string
        required: true
        equals_string: 0.27.0-draft
      mapping_profile:
        range: string
        description: Versioned set of recognized sections, aliases, metadata keys, and explicit decomposition
          rules.
        required: true
      scope:
        range: ScanScope
        required: true
        inlined: true
      sources:
        range: SourceResource
        required: true
        multivalued: true
        inlined_as_list: true
      documents:
        range: Document
        required: true
        multivalued: true
        inlined_as_list: true
      content_nodes:
        range: ContentNode
        required: true
        multivalued: true
        inlined_as_list: true
      fragments:
        range: SourceFragment
        multivalued: true
        inlined_as_list: true
      elements:
        range: DomainElement
        required: true
        multivalued: true
        inlined_as_list: true
      references:
        range: SourceReference
        multivalued: true
        inlined_as_list: true
      label_occurrences:
        range: LabelOccurrence
        multivalued: true
        inlined_as_list: true
      resolutions:
        range: Resolution
        multivalued: true
        inlined_as_list: true
      assertions:
        range: Assertion
        description: Optional materialized relation views, derived from canonical typed fields and checked
          for consistency.
        multivalued: true
        inlined_as_list: true
      content_bindings:
        range: ContentBinding
        required: true
        multivalued: true
        inlined_as_list: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        inlined_as_list: true
      coverage:
        range: CoverageReport
        required: true
        inlined: true
      representation_version:
        range: string
        description: Version of this serialized snapshot contract, separate from the domain metamodel version.
        required: true
        equals_string: 0.2.0
      context_sources:
        range: ContextSource
        multivalued: true
        inlined_as_list: true
    tree_root: true
  SpecificationProject:
    in_subset:
    - inspection-and-coverage
    description: A tooling partition rooted at the directory containing its dotspec.yaml.
    attributes:
      name:
        range: string
        required: true
      root:
        range: string
        required: true
  ScanScope:
    in_subset:
    - inspection-and-coverage
    description: Declared scan boundary and completion, independently of whether individual documents are valid.
    attributes:
      project:
        range: SpecificationProject
        inlined: true
        description: Selected tooling project, independent of domain System relationships.
      roots:
        range: string
        required: true
        multivalued: true
      discovery_complete:
        range: boolean
        required: true
      reads_complete:
        range: boolean
        required: true
      inspection_complete:
        range: boolean
        required: true
      limitations:
        range: string
        multivalued: true
      selected_spec_types:
        range: SpecificationType
        required: true
        multivalued: true
        description: Specification types selected for this inspection.
      discovery_policy:
        range: DiscoveryPolicy
        required: true
        inlined: true
      reference_traversal:
        range: ReferenceTraversal
        required: true
        inlined: true
  SourceResource:
    in_subset:
    - source-artifacts
    description: An addressable source; a SourceDocument records the outcome of a local read.
    is_a: Record
    abstract: true
  SourceDocument:
    in_subset:
    - source-artifacts
    description: A discovered Markdown or related file. A failed read retains identity, locator, status and
      diagnostics.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDocument
    attributes:
      selected:
        range: boolean
        description: True for specification files selected by discovery in the scan scope. Context acquired
          through references or enclosing system lookup is excluded from the selected set.
      project:
        range: SpecificationProject
        inlined: true
        description: Project whose manifest is nearest to this acquired source.
      locator:
        range: string
        required: true
      read_status:
        range: ReadStatus
        required: true
      media_type:
        range: string
      markdown:
        range: string
        description: Markdown text for parsed documents, normalized to UTF-8 and LF for reading and source locations.
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
  ExternalResource:
    in_subset:
    - source-artifacts
    description: An external address explicitly mentioned by source; no implied fetch or trust.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: ExternalResource
    attributes:
      locator:
        range: string
        required: true
      media_type:
        range: string
  ByteSpan:
    in_subset:
    - source-artifacts
    description: Half-open [start,end) offsets into UTF-8 bytes of the normalized Markdown text. Graph checks enforce
      bounds and start <= end.
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
  Document:
    in_subset:
    - document-content
    description: Syntax and interpretation state for an acquired document, separate from its SourceDocument
      read state.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Document
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      parse_status:
        range: ParseStatus
        required: true
      parser:
        range: string
        description: Parser name/version and dialect, e.g. the current Goldmark-based syntax pipeline.
        required: true
      root:
        range: ContentNode
        description: Root includes frontmatter, all Markdown, and retained trivia/opaque spans.
        required: true
        annotations:
          relationship_category: representation
      frontmatter:
        range: ContentNode
        description: Frontmatter roots with parsed YAML trees or opaque invalid content.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: provenance
      frontmatter_parse_status:
        range: ParseStatus
      declared_type:
        range: string
        description: Declared metadata type, exactly as authored; original key/value syntax remains in the
          tree. A recognized value is a SpecificationType.
      authored_id:
        range: string
        description: Interpreted document ID when available; invalid metadata remains in the tree and diagnostics.
      metadata_root:
        range: ContentNode
        description: Parsed YAML root; ordered mapping entries preserve arbitrary keys, duplicate keys, lists,
          tags and scalar types.
        annotations:
          relationship_category: provenance
      domain_decomposition:
        range: DecompositionStatus
        required: true
      elements:
        range: DomainElement
        description: Index of every domain element mapped from this document. Indexing is not ownership, except
          that a document-owned ExtensionSection names this document as its owner and must appear here.
        multivalued: true
        annotations:
          relationship_category: representation
          relationship_scope: Mapped elements of the same source document. Document-owned glossary terms have a separate glossary_terms membership.
          relationship_inverse: ExtensionSection.owner
      coverage:
        range: CoverageReport
        required: true
        inlined: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
      glossary_context:
        range: string
        description: Optional name of the context in which this vocabulary defines its terms.
      glossary_terms:
        range: GlossaryTerm
        multivalued: true
        list_elements_ordered: true
        description: Terms defined by the level-two headings of a declared Markdown glossary source.
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: GlossaryTerm.owner
    annotations:
      owned_memberships: Document.glossary_terms
  ContentNode:
    in_subset:
    - document-content
    description: An ordered source syntax node. Text spans preserve authored syntax; typed properties expose parsed
      structure without requiring every dialect to be understood.
    is_a: Record
    slot_usage:
      kind:
        equals_string: ContentNode
    attributes:
      document:
        range: Document
        required: true
        annotations:
          relationship_category: representation
      node_kind:
        range: NodeKind
        required: true
      span:
        range: ByteSpan
        required: true
        inlined: true
      children:
        range: ContentNode
        description: Ordered direct children. YAML entry children are key then value; repeated mappings are
          retained, not collapsed.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: representation
          relationship_scope: Ordered direct children in the same document; each non-root node has exactly
            one syntax parent.
          relationship_cycles: forbidden
      heading_level:
        range: integer
        minimum_value: 1
        maximum_value: 6
      list_ordered:
        range: boolean
      list_start:
        range: integer
      list_delimiter:
        range: string
      task_state:
        range: string
      code_info:
        range: string
      destination:
        range: string
        description: Parsed link/image/reference destination; authored spelling stays in the raw span.
      title:
        range: string
      label:
        range: string
      decoded_text:
        range: string
        description: Optional decoded textual view; linked to the normalized Markdown.
      scalar_kind:
        range: ScalarKind
      scalar_tag:
        range: string
      scalar_string:
        range: string
      scalar_boolean:
        range: boolean
      scalar_integer:
        range: integer
      scalar_float:
        range: double
      scalar_timestamp:
        range: datetime
      scalar_binary_base64:
        range: string
      anchor_name:
        range: string
      alias_name:
        range: string
      syntax_properties:
        range: SyntaxProperty
        description: Dialect properties not covered by dedicated syntax fields.
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      opaque_reason:
        range: string
        description: Required by graph checks for opaque nodes; distinguish unsupported, malformed, and unparsed
          syntax.
  SyntaxProperty:
    in_subset:
    - document-content
    description: A typed syntax extension property, retained without asserting domain meaning.
    attributes:
      name:
        range: string
        required: true
      value:
        range: string
        required: true
      value_type:
        range: ScalarKind
  SourceFragment:
    in_subset:
    - source-artifacts
    description: An addressable heading, explicit anchor, or occurrence in a source document, without implying
      domain-element identity.
    is_a: Record
    slot_usage:
      kind:
        equals_string: SourceFragment
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      content_node:
        range: ContentNode
        annotations:
          relationship_category: provenance
      span:
        range: ByteSpan
        inlined: true
      authored_anchor:
        range: string
      generated_anchor:
        range: string
      anchor_rule:
        range: string
  RichContent:
    in_subset:
    - document-content
    description: A typed domain value backed by ordered syntax nodes. Omitted slot means absent; presence=empty
      means an explicitly present empty field. Narrative remains valid without fabricated atomic assertions.
    attributes:
      presence:
        range: Presence
        required: true
      content_nodes:
        range: ContentNode
        description: Ordered non-overlapping roots of this field value; an empty field has no body nodes.
        required: true
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: provenance
          relationship_scope: Ordered, non-overlapping roots in the containing record source document.
      decomposition:
        range: DecompositionStatus
        description: State of optional finer structure, independent of named-field mapping coverage.
        required: true
    rules:
    - description: An explicitly empty field has no body content nodes; this rule requires the content checker
        in the selected JSON projection.
      preconditions:
        slot_conditions:
          presence:
            equals_string: empty
      postconditions:
        slot_conditions:
          content_nodes:
            maximum_cardinality: 0
            range: ContentNode
            multivalued: true
    - description: An authored field points to at least one source content node; this rule requires the content
        checker in the selected JSON projection.
      preconditions:
        slot_conditions:
          presence:
            equals_string: authored
      postconditions:
        slot_conditions:
          content_nodes:
            minimum_cardinality: 1
            range: ContentNode
            multivalued: true
    annotations:
      json_schema_projection_gap: LinkML 1.12.1 omits minItems/maxItems for the presence-dependent class-rule
        cardinality. Preserve these formal rules and enforce empty/authored node cardinality in the graph/content
        checker; do not claim JSON Schema alone enforces them.
  ContentBinding:
    in_subset:
    - specification-traceability
    description: Auditable mapping from source syntax to a named domain field, metadata, structural support,
      unknown extension, or uninterpreted fallback.
    is_a: Record
    slot_usage:
      kind:
        equals_string: ContentBinding
    attributes:
      content_node:
        range: ContentNode
        required: true
        annotations:
          relationship_category: provenance
          relationship_scope: Source syntax represented by owner.field_path in the same source document; role
            and scope govern coverage.
      scope:
        range: BindingScope
        required: true
      owner:
        range: Record
        description: Owning Document, DomainElement, or other addressable record.
        required: true
        annotations:
          relationship_category: provenance
          relationship_scope: Record containing field_path; the named field must exist and represent content_node
            in the same source document.
      field_path:
        range: string
        description: Model slot path relative to owner; graph check verifies it exists and points to the represented
          value.
        required: true
      role:
        range: BindingRole
        required: true
      mapping_rule:
        range: string
        description: Versioned mapping rule, including recognized heading alias.
        required: true
      known_role:
        range: string
        description: Recognized domain role, if any; a known role routed to fallback remains unmapped in coverage.
      reason:
        range: string
        description: Required for fallback or extension bindings; explain the interpretive boundary.
    rules:
    - description: A fallback binding states its interpretive boundary.
      preconditions:
        slot_conditions:
          role:
            equals_string: fallback
      postconditions:
        slot_conditions:
          reason:
            required: true
    - description: An extension binding states its interpretive boundary.
      preconditions:
        slot_conditions:
          role:
            equals_string: extension
      postconditions:
        slot_conditions:
          reason:
            required: true
  CoverageReport:
    in_subset:
    - inspection-and-coverage
    description: A checked accounting of representation and named-role mapping, not a claim that every prose
      proposition was formalized.
    attributes:
      status:
        range: CoverageStatus
        required: true
      mapping_profile:
        range: string
        required: true
      unbound_content_nodes:
        range: ContentNode
        description: Syntax not covered by any applicable binding; prevents complete_for_profile.
        multivalued: true
        annotations:
          relationship_category: provenance
      unmapped_known_roles:
        range: UnmappedRole
        description: Recognized content still lacking its named domain mapping; prevents complete_for_profile.
        multivalued: true
        inlined_as_list: true
      extension_sections:
        range: ExtensionSection
        description: Unknown domain headings, explicitly retained; not evidence of complete domain semantics.
        multivalued: true
        annotations:
          relationship_category: provenance
      uninterpreted_nodes:
        range: ContentNode
        description: Retained opaque or fallback syntax, separate from unknown domain sections.
        multivalued: true
        annotations:
          relationship_category: provenance
      limitations:
        range: string
        multivalued: true
  UnmappedRole:
    in_subset:
    - inspection-and-coverage
    description: A known domain field or item whose source content has not yet been mapped.
    attributes:
      role:
        range: string
        required: true
      content_nodes:
        range: ContentNode
        required: true
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: provenance
      reason:
        range: string
        required: true
  DomainElement:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: A source-backed semantic record. Snapshot IDs are required; authored IDs remain optional except
      where the source format requires them.
    is_a: Record
    abstract: true
    attributes:
      authored_id:
        range: string
        description: An explicitly authored ID when present; no manufactured global identifier.
      notes:
        range: RichContent
        inlined: true
        description: Explanation of the element; not a separate obligation or endorsement.
      implementation_suggestions:
        range: RichContent
        inlined: true
        description: Nonbinding implementation advice, distinct from required behavior.
      illustrative_examples:
        range: RichContent
        inlined: true
        description: Illustrations, not an exhaustive behavioral specification.
      source_document:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      name:
        range: RichContent
        description: Authored title or item name, if present.
        inlined: true
      source_fragment:
        range: SourceFragment
