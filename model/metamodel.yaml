      stakeholder_interests:
        range: RichContent
        inlined: true
        description: Stakeholders and their interests in this use case, including nonparticipants, as authored.
      minimal_guarantees_content:
        range: RichContent
        inlined: true
        description: 'Complete authored Minimal guarantees section: what holds for stakeholders however the
          use case ends.'
        annotations:
          paired_with: minimal_guarantees
      minimal_guarantees:
        range: Condition
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Explicitly distinguished items; prose remains authoritative.
        annotations:
          paired_with: minimal_guarantees_content
      success_guarantees_content:
        range: RichContent
        inlined: true
        description: 'Complete authored Success guarantees section: what holds when the primary actor''s goal
          is achieved.'
        annotations:
          paired_with: success_guarantees
      success_guarantees:
        range: Condition
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Explicitly distinguished items; prose remains authoritative.
        annotations:
          paired_with: success_guarantees_content
      main_success_scenario:
        range: Scenario
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: Scenario.owner
      extensions_content:
        range: RichContent
        inlined: true
        description: Complete Extensions section, including its introduction and undecomposed narrative.
        annotations:
          paired_with: extensions
      extensions:
        range: UseCaseExtension
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: UseCaseExtension.owner
          relationship_label: branches
          paired_with: extensions_content
        description: Explicitly authored alternative or failure branches, in authored order.
      sequence:
        range: RichContent
        inlined: true
        description: Authored statement about which ordering is representative or required; scenario step order
          alone creates no constraint.
      involves_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      involves_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: involves_content
      involves:
        range: ConceptUse
        multivalued: true
        description: Named concept uses participating in this actor-goal interaction; not a service boundary
          or mandatory execution order.
        annotations:
          relationship_category: semantic-association
          trace_heading: Involves
          trace_targets: ConceptUse
          requires_content: involves_content
      subject_system:
        range: System
        annotations:
          relationship_category: semantic-association
          relationship_scope: Any explicitly referenced acquired System; independent of directory context.
          relationship_basis: Projection of explicit authored reference or label occurrences.
          relationship_label: has subject system
    annotations:
      owned_memberships: UseCase.main_success_scenario or UseCase.extensions
    mixins:
    - ObligationContainer
  ActorMention:
    in_subset:
    - software-requirements
    description: The primary actor's role as authored in this use case; no global actor identity or fabricated
      role extraction.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      references:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: contextual-citation
  Condition:
    in_subset:
    - software-requirements
    description: An explicitly distinguished condition; prose remains authoritative.
    attributes:
      statement:
        range: RichContent
        inlined: true
      references:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: contextual-citation
  Scenario:
    in_subset:
    - software-requirements
    description: An addressable scenario body and its explicitly authored ordered steps. Narrative-only scenarios
      remain valid.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: Scenario
    attributes:
      owner:
        range: UseCase
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: UseCase.main_success_scenario
      content:
        range: RichContent
        inlined: true
        required: true
      steps:
        range: ScenarioStep
        description: Source order only. Required sequencing belongs in the Sequence section.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ScenarioStep.owner
    annotations:
      owned_memberships: Scenario.steps
  ScenarioStep:
    in_subset:
    - software-requirements
    description: An explicitly distinguished interaction step, expressed as a label and narrative. Actor, action
      and result wording remains in the narrative.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: ScenarioStep
    attributes:
      illustrates_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      illustrates_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: illustrates_content
      illustrates:
        range: DomainElement
        multivalued: true
        description: Obligations, business rules or actions explicitly illustrated by this step. No completeness
          or execution assertion.
        annotations:
          relationship_category: semantic-association
          trace_heading: Illustrates
          trace_targets: Obligation or BusinessRule or ConceptAction
          requires_content: illustrates_content
        any_of:
        - range: Obligation
        - range: BusinessRule
        - range: ConceptAction
      owner:
        range: DomainElement
        required: true
        any_of:
        - range: Scenario
        - range: UseCaseExtension
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: Scenario.steps or UseCaseExtension.steps
      authored_label:
        range: string
        description: Original number or label; snapshot ID supplies addressability.
      content:
        range: RichContent
        inlined: true
        required: true
      references:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: contextual-citation
  UseCaseExtension:
    in_subset:
    - software-requirements
    description: An explicitly distinguished alternative or failure branch. Full narrative is retained; condition
      and handling are optional decompositions. Where the condition arises is part of the label or narrative.
      Condition-only entries are valid.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: UseCaseExtension
    attributes:
      owner:
        range: DomainElement
        required: true
        any_of:
        - range: UseCase
        - range: UseCaseExtension
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: UseCase.extensions or UseCaseExtension.branches
      authored_label:
        range: string
        description: Optional authored branch label, including nested or relative labels; not a durable ID.
      content:
        range: RichContent
        inlined: true
        required: true
      condition:
        range: RichContent
        inlined: true
      handling:
        range: RichContent
        description: Authored handling narrative, including any resumption, conclusion or unresolved question.
        inlined: true
      steps:
        range: ScenarioStep
        description: Explicit handling steps in source order; no execution semantics are inferred.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ScenarioStep.owner
      references:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: contextual-citation
      branches:
        range: UseCaseExtension
        description: Explicitly authored nested branches, in document order.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: UseCaseExtension.owner
    annotations:
      owned_memberships: UseCaseExtension.steps or UseCaseExtension.branches
  Concept:
    in_subset:
    - software-requirements
    description: A behavior-bearing concept described by purpose, abstract state, actions and an operational
      principle.
    is_a: SystemContextSpecification
    slot_usage:
      kind:
        equals_string: Concept
    attributes:
      effects_table_content:
        range: RichContent
        inlined: true
        description: Complete authored Effects table section; no effects, unchanged values or operation classifications
          are inferred.
        annotations:
          paired_with: effects_table
      effects_table:
        range: EffectsRow
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Rows of the optional authored operation-by-observable-property matrix. Empty cells mean
          unspecified, never unchanged.
        annotations:
          paired_with: effects_table_content
      purpose:
        range: RichContent
        inlined: true
      abstract_state:
        range: StateDescription
        inlined: true
      actions_content:
        range: RichContent
        inlined: true
        description: Complete Actions section narrative; an unsegmented Actions section is valid.
        annotations:
          paired_with: actions
      actions:
        range: ConceptAction
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ConceptAction.owner
          paired_with: actions_content
        description: Explicitly named actions, in authored order.
      operational_principles:
        range: RichContent
        inlined: true
    annotations:
      owned_memberships: Concept.actions
    mixins:
    - ObligationContainer
  StateDescription:
    in_subset:
    - software-requirements
    description: The State section as narrative and optional explicitly named state components/invariants;
      no reverse-engineered implementation model.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      initial_state:
        range: RichContent
        inlined: true
      elements:
        range: StateElement
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      invariants:
        range: Condition
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  StateElement:
    in_subset:
    - software-requirements
    description: An explicitly named abstract state component.
    attributes:
      name:
        range: RichContent
        inlined: true
      description:
        range: RichContent
        inlined: true
      value_description:
        range: RichContent
        inlined: true
      derivation:
        range: RichContent
        inlined: true
  ConceptAction:
    in_subset:
    - software-requirements
    description: An explicitly named concept action. Caller assumptions and enforced guards are different authored
      claims.
    is_a: TraceableElement
    slot_usage:
      kind:
        equals_string: ConceptAction
    attributes:
      owner:
        range: Concept
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: Concept.actions
      description:
        range: RichContent
        inlined: true
      inputs:
        range: RichContent
        inlined: true
      outputs:
        range: RichContent
        inlined: true
      caller_assumptions_content:
        range: RichContent
        inlined: true
        description: Complete authored Caller assumptions section.
        annotations:
          paired_with: caller_assumptions
      caller_assumptions:
        range: Condition
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Explicitly distinguished items; prose remains authoritative.
        annotations:
          paired_with: caller_assumptions_content
      guards_content:
        range: RichContent
        inlined: true
        description: Complete authored Guards section.
        annotations:
          paired_with: guards
      guards:
        range: Condition
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Explicitly distinguished items; prose remains authoritative.
        annotations:
          paired_with: guards_content
      effects:
        range: RichContent
        inlined: true
      rejections:
        range: RichContent
        inlined: true
      initiation:
        range: RichContent
        inlined: true
        description: Authored initiation conditions, including user or system actions; no scheduler or caller
          is inferred.
    mixins:
    - ObligationContainer
  ConceptUse:
    in_subset:
    - software-requirements
    description: An explicitly named design-time inclusion of a concept in a system or component specification. Multiple uses of one definition remain distinct; directory association creates no use.
    is_a: TraceableElement
    slot_usage:
      kind:
        equals_string: ConceptUse
    attributes:
      owner:
        range: DomainElement
        any_of:
        - range: System
        - range: Component
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: System.concept_uses or Component.concept_uses
      content:
        range: RichContent
        inlined: true
        required: true
      definition_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
      definition:
        range: Concept
        annotations:
          relationship_category: semantic-association
          relationship_scope: Any acquired concept definition; directory context does not restrict reuse.
          relationship_basis: Projection of explicit authored reference or label occurrences.
      description:
        range: RichContent
        inlined: true
        description: The role of this particular concept use in its declaring context.
      configuration:
        range: RichContent
        inlined: true
      dependencies_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      dependencies_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: dependencies_content
      dependencies:
        range: ConceptUse
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: semantic-association
          relationship_scope: Named uses in the same System; mutual dependencies are permitted.
          relationship_basis: Projection of explicit authored reference or label occurrences.
          requires_content: dependencies_content
          relationship_source: dependencies_content
    mixins:
    - ObligationContainer
  Synchronization:
    in_subset:
    - software-requirements
    description: A composition rule declared in a system or component specification. Narrative and action references describe
      coordination; no atomicity, execution or completeness is inferred.
    is_a: TraceableElement
    slot_usage:
      kind:
        equals_string: Synchronization
    attributes:
      owner:
        range: DomainElement
        any_of:
        - range: System
        - range: Component
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: System.synchronizations or Component.synchronizations
      content:
        range: RichContent
        inlined: true
        required: true
      when:
        range: RichContent
        inlined: true
      where:
        range: RichContent
        inlined: true
      then:
        range: RichContent
        inlined: true
      semantics:
        range: RichContent
        inlined: true
    mixins:
    - ObligationContainer
  ObligationClause:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: An explicitly distinguished obligation inside another specification or behavioral model. Its
      content is the authored expression, not a duplicate requirement document. Project authority determines
      acceptance; declaration alone does not.
    is_a: TraceableElement
    slot_usage:
      kind:
        equals_string: ObligationClause
    attributes:
      owner:
        range: ObligationContainer
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: ObligationContainer.obligations
    mixins:
    - Obligation
  Requirement:
    in_subset:
    - software-requirements
    description: A specification that gives one obligation its own document. An obligation is what ISO/IEC/IEEE
      29148 calls a requirement, wherever it is written; this class names the specification type, not every
      normative expression. Functional and quality requirements share this type. Either can reference a quality attribute.
    is_a: SystemContextSpecification
    mixins:
    - Obligation
    slot_usage:
      kind:
        equals_string: Requirement
  Applicability:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: Operating context covered by an obligation or business rule, with optional explicit dimensions.
      For outcomes of use, identify users, tasks, equipment or assistance, and environment. Record the required operating context here.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      conditions:
        range: RichContent
        inlined: true
      workload:
        range: RichContent
        inlined: true
      population:
        range: RichContent
        inlined: true
      exclusions:
        range: RichContent
        inlined: true
  ObligationCriterion:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: Optional explicit rule for satisfaction of an obligation, qualitative or measured. Define
      each bound once or reference its authoritative statement or source. Operating context belongs to the obligation's applicability. A criterion is not a measurement procedure
      or an observation, and quality classification does not supply a criterion.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      measure:
        range: RichContent
        inlined: true
        description: Property observed and its operational definition or reference, including units, calculation,
          aggregation and observation window where needed.
      target:
        range: RichContent
        inlined: true
        description: Required value, bound or acceptable range, including the comparison. Preferred targets
          belong in rationale or notes and must be identified as nonbinding.
  OpenQuestion:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: An explicitly authored unresolved question; do not infer every omitted field to be an open
      question.
    attributes:
      question:
        range: RichContent
        inlined: true
  ContextualReferences:
    in_subset:
    - specification-traceability
    description: Contextual citations of related specifications or other explicit targets, including the prose
      explaining their context. Links alone do not imply authority, support or verification relations.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
      items:
        range: ContextualReference
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  ContextualReference:
    in_subset:
    - specification-traceability
    description: An explicitly distinguished contextual citation with its explanation.
    attributes:
      description:
        range: RichContent
        inlined: true
      references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
  ExtensionSection:
    in_subset:
    - document-content
    description: An unknown domain section retained with its original heading and body. This is explicit representation,
      not a claim that its domain semantics have been modeled.
    is_a: DomainElement
    slot_usage:
      kind:
        equals_string: ExtensionSection
      extension_sections:
        description: Not used by unknown sections, which nest through children; absent or empty.
        maximum_cardinality: 0
    attributes:
      owner:
        range: Record
        required: true
        any_of:
        - range: Document
        - range: DomainElement
        description: Domain owner when mapped; otherwise the Document, including ordinary Markdown or a failed
          domain extraction.
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Checked inverse of canonical membership fields.
          relationship_inverse: DomainElement.extension_sections or ExtensionSection.children or Document.elements
      heading:
        range: RichContent
        inlined: true
      content:
        range: RichContent
        inlined: true
        required: true
      children:
        range: ExtensionSection
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ExtensionSection.owner
      reason:
        range: string
        required: true
    annotations:
      owned_memberships: ExtensionSection.children
  SourceReference:
    in_subset:
    - specification-traceability
    description: An authored reference occurrence, independent of whether it resolves or carries semantic intent.
    is_a: Record
    slot_usage:
      kind:
        equals_string: SourceReference
    attributes:
      source_document:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      content_node:
        range: ContentNode
        required: true
        annotations:
          relationship_category: provenance
          relationship_scope: The authored link occurrence in source_document.
      form:
        range: ReferenceForm
        required: true
      authored_target:
        range: string
        description: Literal destination or label, including fragments; do not replace it with a normalized
          target.
        required: true
      context_owner:
        range: DomainElement
        annotations:
          relationship_category: provenance
          relationship_scope: The domain record in the reference source_document to which context_field applies.
      context_field:
        range: string
      definition_node:
        range: ContentNode
        annotations:
          relationship_category: provenance
      resolution:
        range: Resolution
        annotations:
          relationship_category: provenance
          relationship_scope: A resolution for this exact authored reference occurrence; reciprocal pointers
            must agree.
          relationship_inverse: Resolution.occurrence
  LabelOccurrence:
    in_subset:
    - specification-traceability
    description: An authored semantic classification or parent label, preserved even when no target can be
      bound.
    is_a: Record
    slot_usage:
      kind:
        equals_string: LabelOccurrence
    attributes:
      owner:
        range: DomainElement
        required: true
        any_of:
        - range: Obligation
        - range: QualityAttribute
        annotations:
          relationship_category: provenance
          relationship_scope: Obligation for a quality-classification label, or QualityAttribute for a sub-attribute
            label; retained in the corresponding occurrence list.
          relationship_inverse: Obligation.quality_attribute_labels or QualityAttribute.subattribute_of_labels
      role:
        range: LabelRole
        required: true
      label:
        range: string
        required: true
      content_node:
        range: ContentNode
        required: true
        annotations:
          relationship_category: provenance
      resolution:
        range: Resolution
        annotations:
          relationship_category: provenance
          relationship_scope: A resolution for this exact authored label occurrence; reciprocal pointers must
            agree.
          relationship_inverse: Resolution.occurrence
      governing_system:
        range: System
        description: System whose declared quality attributes govern this label, if established. This is the
          declaring System or the specification system of a classified obligation, or the System declaring a
          sub-attribute.
        annotations:
          relationship_category: provenance
      governing_quality_model:
        range: QualityModel
        description: Quality model whose definitions govern a parent label on a reusable definition; never
          used for obligation classification.
        annotations:
          relationship_category: provenance
  Resolution:
    in_subset:
    - specification-traceability
    description: The recorded outcome of resolving one authored reference or label; targets need not be domain
      entities.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Resolution
    attributes:
      occurrence:
        range: Record
        required: true
        any_of:
        - range: SourceReference
        - range: LabelOccurrence
        annotations:
          relationship_category: provenance
          relationship_scope: The authored occurrence whose resolution points back to this record.
          relationship_inverse: SourceReference.resolution or LabelOccurrence.resolution
      status:
        range: ResolutionStatus
        required: true
      target:
        range: Record
        description: Only for resolved; target may be a domain element, source resource or source fragment.
        any_of:
        - range: DomainElement
        - range: SourceResource
        - range: SourceFragment
        annotations:
          relationship_category: provenance
      candidates:
        range: Record
        description: Candidates for an ambiguous resolution.
        multivalued: true
        annotations:
          relationship_category: provenance
      rule:
        range: string
        required: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
    rules:
    - description: A resolved occurrence names a target; target identity and type are graph checks.
      preconditions:
        slot_conditions:
          status:
            equals_string: resolved
      postconditions:
        slot_conditions:
          target:
            required: true
  Diagnostic:
    in_subset:
    - inspection-and-coverage
    description: A parser, mapper, resolver, coverage or graph-check finding. It may identify a source without
      any line, element or parsed document.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Diagnostic
    attributes:
      code:
        range: string
        required: true
      severity:
        range: Severity
        required: true
      message:
        range: string
        required: true
      source:
        range: SourceDocument
        annotations:
          relationship_category: provenance
      span:
        range: ByteSpan
        inlined: true
      record:
        range: Record
        annotations:
          relationship_category: provenance
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      phase:
        range: string
        description: Read, parse, map, resolve, coverage or graph; retain the producing subsystem.
        required: true
      element:
        range: string
        description: Authored source element named by the native diagnostic, when available.
      related:
        range: SourceLocation
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Related native source locations, preserving their original order and optional coordinates.
  Assertion:
    in_subset:
    - specification-traceability
    description: An optional derived view of one canonical relationship field, with required endpoints and
      explicit provenance. projection_path names the field; the field itself remains authoritative for endpoint
      types, scope and cycles. Ordinary source links remain SourceReference occurrences and do not automatically
      become assertions.
    is_a: Record
    attributes:
      projection_path:
        required: true
        range: string
        description: 'Canonical Class.field path of the projected relationship: a declaration membership, semantic
          association or structural context field. It identifies the relationship and its role.'
      mapping_rule:
        range: string
        description: Versioned rule that derived this assertion; identifies deterministic semantics, not a
          hidden heuristic.
        required: true
      inputs:
        range: Record
        description: Source occurrences and/or typed records supporting this assertion. A graph check requires
          at least one.
        required: true
        multivalued: true
        annotations:
          relationship_category: provenance
      source_nodes:
        range: ContentNode
        multivalued: true
        annotations:
          relationship_category: provenance
      source_spans:
        range: ByteSpan
        multivalued: true
        inlined_as_list: true
      subject:
        range: DomainElement
        description: Record from which the projected canonical relationship originates.
        required: true
        annotations:
          relationship_category: derived-projection
      object:
        range: Record
        description: Record targeted by the projected canonical relationship.
        required: true
        annotations:
          relationship_category: derived-projection
    slot_usage:
      kind:
        equals_string: Assertion
  DiscoveryPolicy:
    in_subset:
    - inspection-and-coverage
    description: Recorded discovery bounds. Current dotspec uses git or filesystem mode and excludes symlinks
      and nested repositories.
    attributes:
      mode:
        range: DiscoveryMode
        required: true
      rule:
        range: string
        description: Versioned discovery policy identifier.
        required: true
      follow_symlinks:
        range: boolean
        required: true
      include_nested_repositories:
        range: boolean
        required: true
  ReferenceTraversal:
    in_subset:
    - inspection-and-coverage
    description: Recorded reference traversal, independent of file discovery and domain semantic relations.
    attributes:
      mode:
        range: ReferenceTraversalMode
        required: true
      include_system_context:
        range: boolean
        required: true
      follow_external_resources:
        range: boolean
        required: true
      repository_bounded:
        range: boolean
        required: true
      maximum_depth:
        range: integer
        minimum_value: 0
      rule:
        range: string
        required: true
  ContextSource:
    in_subset:
    - inspection-and-coverage
    description: A consulted context source and the reason it entered the snapshot.
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      role:
        range: ContextSourceRole
        required: true
      requested_by:
        range: SourceDocument
        multivalued: true
        annotations:
          relationship_category: provenance
      reference_occurrences:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: provenance
      rule:
        range: string
        required: true
  SourceDirectory:
    in_subset:
    - source-artifacts
    description: An addressable local directory referenced by Markdown. It is a resource target, not a document
      and carries a directory path.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDirectory
    attributes:
      locator:
        range: string
        required: true
  SourceLocation:
    in_subset:
    - source-artifacts
    description: A diagnostic source location, including path-only or external-to-snapshot locations without
      invented coordinates.
    attributes:
      source:
        range: SourceDocument
        annotations:
          relationship_category: provenance
      locator:
        range: string
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      element:
        range: string
      span:
        range: ByteSpan
        inlined: true
  ObligationContainer:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: Explicit declaration container for embedded obligation clauses. Traceability alone does not
      confer containment.
    is_a: TraceableElement
    abstract: true
    mixin: true
    attributes:
      obligations_content:
        range: RichContent
        inlined: true
        annotations:
          paired_with: obligations
      obligations:
        range: ObligationClause
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_basis: Explicit authored clause declarations; no semantic inference from prose.
          relationship_inverse: ObligationClause.owner
          paired_with: obligations_content
    annotations:
      owned_memberships: ObligationContainer.obligations
  Obligation:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: An obligation, expressed in its own Requirement specification or as a clause inside another
      specification. This is what ISO/IEC/IEEE 29148 calls a requirement. An optional explicit criterion defines
      or references the satisfaction rule.
    is_a: TraceableElement
    abstract: true
    mixin: true
    attributes:
      applies_to_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          requires_content: applicability.content
          relationship_category: contextual-citation
      applies_to:
        range: DomainElement
        multivalued: true
        annotations:
          relationship_category: semantic-association
          relationship_scope: Explicitly referenced acquired domain records; cross-system links are permitted.
          relationship_basis: Projection of explicit authored reference or label occurrences.
      applicability:
        range: Applicability
        inlined: true
      rationale:
        range: RichContent
        inlined: true
      quality_attribute_labels:
        range: LabelOccurrence
        description: Every authored attribute label, including undefined or unbound labels.
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: provenance
          relationship_scope: Quality-classification occurrences owned by this obligation; resolve within its
            declaring System or specification system.
          relationship_inverse: LabelOccurrence.owner
      refines_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      refines_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: refines_content
      refines:
        range: DomainElement
        multivalued: true
        description: Adds precision while preserving the referenced obligation; not replacement, duplication
          or proof. Multiple parents are permitted.
        annotations:
          relationship_category: semantic-association
          relationship_cycles: forbidden
          trace_heading: Refines
          trace_targets: Requirement or BusinessRule or ObligationClause
          requires_content: refines_content
        any_of:
        - range: Requirement
        - range: BusinessRule
        - range: ObligationClause
      quality_attributes:
        range: QualityAttribute
        description: Only resolved classifications; original occurrences remain separately addressable.
        multivalued: true
        annotations:
          relationship_category: semantic-association
          relationship_scope: Attributes declared by the System that declares this obligation, or by the effective
            specification system of its declaring specification.
          relationship_basis: Projection of explicit authored reference or label occurrences.
          relationship_label: classified by
      statement:
        range: RichContent
        inlined: true
      criterion:
        range: ObligationCriterion
        inlined: true
        description: Optional explicit satisfaction rule, defining or referencing the required bounds once.
          The criterion can cite an authoritative source.
  Component:
    in_subset:
    - software-requirements
    is_a: SystemContextSpecification
    description: A named part of a system with a described responsibility and boundary. Neither its declaration
      nor code location establishes structural parentage.
    slot_usage:
      kind:
        equals_string: Component
    attributes:
      concept_uses_content:
        range: RichContent
        inlined: true
        annotations:
          paired_with: concept_uses
      concept_uses:
        range: ConceptUse
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ConceptUse.owner
          paired_with: concept_uses_content
      synchronizations_content:
        range: RichContent
        inlined: true
        annotations:
          paired_with: synchronizations
      synchronizations:
        range: Synchronization
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: Synchronization.owner
          paired_with: synchronizations_content
      out_of_scope:
        range: RichContent
        inlined: true
        description: Explicit boundary exclusions; absence is not a statement of scope.
      required_interfaces_content:
        range: RichContent
        inlined: true
        description: Complete Required interfaces section narrative.
        annotations:
          paired_with: required_interfaces
      required_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: requires interface
          paired_with: required_interfaces_content
        description: Services this subject expects from its environment.
      provided_interfaces_content:
        range: RichContent
        inlined: true
        description: Complete Provided interfaces section narrative.
        annotations:
          paired_with: provided_interfaces
      provided_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: provides interface
          paired_with: provided_interfaces_content
        description: Services this subject exposes to its environment.
      interacts_with_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      interacts_with_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: interacts_with_content
      interacts_with:
        range: DomainElement
        multivalued: true
        description: Explicit interaction partners across this subject boundary; does not establish structural
          containment.
        annotations:
          relationship_category: semantic-association
          trace_heading: Interacts with
          trace_targets: System or Component
          requires_content: interacts_with_content
        any_of:
        - range: System
        - range: Component
      description:
        range: RichContent
        inlined: true
        description: The role this component plays in its system.
      purpose:
        range: RichContent
        inlined: true
        description: Benefit or reason for this component to exist.
      responsibilities:
        range: RichContent
        inlined: true
        description: Authored responsibilities identifying what this component is expected to do.
      boundary_description:
        range: RichContent
        inlined: true
        description: What the component includes, excludes and delegates; normative commitments remain obligations.
      part_of_content:
        range: RichContent
        inlined: true
      part_of_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: part_of_content
      part_of:
        range: DomainElement
        annotations:
          relationship_category: semantic-association
          relationship_scope: Explicit parent in the same project, identified by the component source.
          relationship_cycles: forbidden
          relationship_basis: Projection of explicit authored reference occurrences.
          requires_content: part_of_content
          relationship_source: part_of_content
        any_of:
        - range: System
        - range: Component
        description: System or Component identified by the required Part of link, when resolved. The parent chain must be acyclic.
      contracts:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
      architecture:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
      implementation:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
    annotations:
      owned_memberships: Component.concept_uses or Component.synchronizations or Component.required_interfaces or Component.provided_interfaces
    mixins:
    - ObligationContainer
  Feature:
    in_subset:
    - software-requirements
    is_a: SystemContextSpecification
    description: A recognizable grouping of specified product behavior valued by stakeholders, independent
      of component structure. Membership does not duplicate or own obligations.
    slot_usage:
      kind:
        equals_string: Feature
    attributes:
      description:
        range: RichContent
        inlined: true
        description: The behavior available through this feature.
      purpose:
        range: RichContent
        inlined: true
        description: Stakeholder benefit expressed by this feature.
      groups_content:
        range: RichContent
        inlined: true
      groups_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: groups_content
      groups:
        range: DomainElement
        annotations:
          relationship_category: semantic-association
          relationship_scope: Authored specification membership; many-to-many and independent of ownership.
          relationship_basis: Projection of explicit authored reference occurrences.
          requires_content: groups_content
          relationship_source: groups_content
        any_of:
        - range: Requirement
        - range: ObligationClause
        - range: UseCase
        - range: Concept
        - range: ConceptUse
        - range: Synchronization
        - range: Interface
        multivalued: true
        description: Non-owning specification membership; the same record may participate in several features.
  Capability:
    in_subset:
    - business-requirements
    - software-requirements
    is_a: SystemContextSpecification
    description: An ability needed to deliver value, potentially combining people, procedures and technology.
      Distinct from a product feature or structural component; its declaration does not establish a provider.
    slot_usage:
      kind:
        equals_string: Capability
    attributes:
      description:
        range: RichContent
        inlined: true
        description: The ability this system or organization provides.
      purpose:
        range: RichContent
        inlined: true
        description: What this ability enables and why it matters.
      enablers:
        range: RichContent
        inlined: true
        description: Human, procedural or other enabling context, including external references. Typed providers
          describe only explicitly linked systems and components.
      depends_on_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      depends_on_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: depends_on_content
      depends_on:
        range: Capability
        multivalued: true
        description: Capabilities required by this capability; many-to-many dependencies may be cyclic. Not
          structural containment or an inferred execution sequence.
        annotations:
          relationship_category: semantic-association
          trace_heading: Depends on
          trace_targets: Capability
          requires_content: depends_on_content
      provided_by_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      provided_by_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: provided_by_content
      provided_by:
        range: DomainElement
        multivalued: true
        description: 'Explicitly identified system or component providers. Optional and non-exhaustive: human
          and procedural providers can be described in enablers. Does not assert verified implementation or
          satisfaction.'
        annotations:
          relationship_category: semantic-association
          trace_heading: Provided by
          trace_targets: System or Component
          requires_content: provided_by_content
        any_of:
        - range: System
        - range: Component
  Interface:
    in_subset:
    - software-requirements
    is_a: TraceableElement
    description: An independently addressable description of interaction at a System or Component boundary,
      declared by that System or Component. Required or provided membership states direction relative to the
      declaring subject. Native protocol contracts retain their authority; neither declaration nor citation
      proves implementation or compatibility.
    mixins:
    - ObligationContainer
    slot_usage:
      kind:
        equals_string: Interface
    attributes:
      owner:
        range: DomainElement
        any_of:
        - range: System
        - range: Component
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Checked inverse of canonical declaration membership.
          relationship_inverse: System.required_interfaces or System.provided_interfaces or Component.required_interfaces
            or Component.provided_interfaces
          relationship_label: declared by
      content:
        range: RichContent
        inlined: true
        required: true
      description:
        range: RichContent
        inlined: true
        description: Introductory description of the boundary interaction.
      contracts:
        range: ContextualReferences
        inlined: true
        description: References to authoritative native contracts; no conformance claim is inferred.
      counterpart:
        range: ContextualReferences
        inlined: true
        description: Contextual references to participants or corresponding interfaces; no compatibility claim
          is inferred.
  EffectsRow:
    in_subset:
    - software-requirements
    description: First row is the header. First cell names an operation; subsequent cells describe effects
      on the header properties. Blank cells remain unspecified.
    attributes:
      cells:
        range: RichContent
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
enums:
  ReadStatus:
    description: Whether the source was successfully read.
    permissible_values:
      read:
        description: The source was read successfully.
      failed:
        description: Read attempted but failed; diagnostic retained.
      not_attempted:
        description: Source discovered but not read.
  ParseStatus:
    description: Syntax or frontmatter parse state, independent of domain decomposition.
    permissible_values:
      parsed:
        description: Supported syntax parsed; opaque unsupported syntax may still exist.
      partial:
        description: Some syntax parsed and some malformed or uninterpreted.
      failed:
        description: Parsing failed; normalized text and opaque content remain available.
      not_attempted:
        description: No syntax parse attempted.
  Presence:
    description: Presence of an authored field; omission of the containing slot means absent.
    permissible_values:
      empty:
        description: The field or section is explicitly present without body content.
      authored:
        description: The field contains authored content, including placeholders or unknown statements.
  DecompositionStatus:
    description: Optional explicit internal structure, not prose truth or completeness.
    permissible_values:
      not_attempted:
        description: No structural decomposition attempted.
      unsegmented:
        description: Retained as typed narrative; no finer structure was authored or recognized.
      partial:
        description: Some explicit items mapped; remaining content is retained.
      complete:
        description: All recognized explicit structures within the declared mapping scope mapped.
      failed:
        description: Decomposition attempted but failed; narrative remains retained.
  CoverageStatus:
    description: Checked named-domain mapping status. Syntax retention alone is insufficient.
    permissible_values:
      not_checked:
        description: Coverage has not been checked.
      partial:
        description: Known domain roles remain unmapped or mapping errors exist.
      complete_for_profile:
        description: All known roles in the declared mapping profile are mapped; unknown extensions remain
          explicitly reported.
  NodeKind:
    description: Ordered source syntax tree kinds, including metadata and opaque fallback.
    permissible_values:
      document:
        description: Document.
      frontmatter:
        description: Frontmatter.
      heading:
        description: Heading.
      paragraph:
        description: Paragraph.
      list:
        description: List.
      list_item:
        description: List item.
      block_quote:
        description: Block quote.
      fenced_code:
        description: Fenced code.
      indented_code:
        description: Indented code.
      thematic_break:
        description: Thematic break.
      html_block:
        description: Html block.
      table:
        description: Table.
      table_row:
        description: Table row.
      table_cell:
        description: Table cell.
      link_definition:
        description: Link definition.
      footnote_definition:
        description: Footnote definition.
      text:
        description: Text.
      emphasis:
        description: Emphasis.
      strong:
        description: Strong.
      strikethrough:
        description: Strikethrough.
      link:
        description: Link.
      image:
        description: Image.
      autolink:
        description: Autolink.
      code_span:
        description: Code span.
      soft_break:
        description: Soft break.
      hard_break:
        description: Hard break.
      inline_html:
        description: Inline html.
      footnote_reference:
        description: Footnote reference.
      escape:
        description: Escape.
      entity:
        description: Entity.
      yaml_mapping:
        description: Yaml mapping.
      yaml_entry:
        description: Yaml entry.
      yaml_sequence:
        description: Yaml sequence.
      yaml_scalar:
        description: Yaml scalar.
      yaml_alias:
        description: Yaml alias.
      yaml_anchor:
        description: Yaml anchor.
      comment:
        description: Comment.
      trivia:
        description: Trivia.
      opaque:
        description: Opaque.
      section:
        description: An explicitly grouped heading and its ordered body/subsections; grouping follows a declared
          outline mapping.
  ScalarKind:
    description: Interpreted metadata scalar type; lexical spelling remains in the source span.
    permissible_values:
      string:
        description: String.
      boolean:
        description: Boolean.
      integer:
        description: Integer.
      float:
        description: Float.
      'null':
        description: Null.
      timestamp:
        description: Timestamp.
      binary:
        description: Binary.
      custom:
        description: Custom.
  BindingRole:
    description: How a syntax node contributes to an identified domain field or retained fallback.
    permissible_values:
      named_field:
        description: A recognized domain field, including typed narrative.
      record_identity:
        description: A title, explicit ID, or another identity-bearing syntax item.
      structured_item:
        description: An explicitly authored subrecord or value.
      structural_wrapper:
        description: Tree structure or delimiters supporting named mappings.
      metadata:
        description: Document metadata with a typed syntax representation.
      extension:
        description: Unknown domain section represented by ExtensionSection.
      fallback:
        description: Uninterpreted syntax retained with an explicit reason; no claim of domain interpretation.
  BindingScope:
    description: The nodes covered by a content binding.
    permissible_values:
      node:
        description: Only the identified node.
      subtree:
        description: The node and its ordered descendants, except explicitly overridden bindings.
  ReferenceForm:
    description: Authored reference notation.
    permissible_values:
      inline_link:
        description: Inline link.
      reference_link:
        description: Reference link.
      autolink:
        description: Autolink.
      image:
        description: Image.
      footnote:
        description: Footnote.
      fragment:
        description: Fragment.
      explicit_id:
        description: Explicit id.
      external_locator:
        description: External locator.
  ResolutionStatus:
    description: Resolution results, not extraction/decomposition states.
    permissible_values:
      resolved:
        description: Exactly one inspected target identified.
      unresolved:
        description: An authored target was recognized but not found.
      undefined_label:
        description: A reference-style label lacks a definition, or a system's declared quality attributes
          lack the authored member label.
      unbound_label:
        description: A recognized semantic label has no governing quality attribute declaration.
      ambiguous:
        description: More than one target matches.
      external:
        description: Target is external and has not been inspected.
      out_of_scope:
        description: Target is known to be outside this snapshot scope.
      not_attempted:
        description: Resolution has not been attempted.
  LabelRole:
    description: Semantic label occurrences preserved before resolution.
    permissible_values:
      quality_classification:
        description: An obligation's quality attribute label.
      subattribute_of:
        description: A quality attribute parent label.
  Severity:
    description: Diagnostic severity.
    permissible_values:
      error:
        description: Failure.
      warning:
        description: Potential issue.
      advice:
        description: Non-failing advice.
      info:
        description: Informational result.
  GoalLevelValue:
    description: Optional canonical interpretation of an explicitly authored goal level.
    permissible_values:
      summary:
        description: Summary or kite.
      user_task:
        description: User task or sea.
      subfunction:
        description: Subfunction or fish.
  DiscoveryMode:
    description: How candidate files were discovered.
    permissible_values:
      git:
        description: Repository discovery with Git ignore rules.
      filesystem:
        description: Filesystem discovery without Git ignore rules.
      explicit:
        description: An explicit supplied file inventory.
      unavailable:
        description: Discovery policy could not be established.
  ReferenceTraversalMode:
    description: Which authored reference edges are inspected.
    permissible_values:
      none:
        description: Do not follow references.
      direct:
        description: Follow one edge from selected documents and consulted context.
      transitive:
        description: Traverse multiple edges under explicit limits; not current dotspec behavior.
  ContextSourceRole:
    description: Why a source outside the selected candidates was consulted.
    permissible_values:
      project_configuration:
        description: Local dotspec.yaml declaring the selected project.
      glossary_source:
        description: Markdown vocabulary explicitly included by a system.
      system_context:
        description: Enclosing-system context required for inspection.
      reference_target:
        description: Directly referenced target supplies link/fragment context, not another scan.
      other:
        description: Other declared context, explained by rule.
  SystemAssociationOrigin:
    description: How the specification system of a specification was established.
    permissible_values:
      explicit:
        description: Selected by an authored Specification system reference.
      directory:
        description: Defaulted to the nearest enclosing system found by directory discovery.
  SpecificationType:
    description: Markdown frontmatter types for authored specifications. Each
      type has exactly one concrete Specification class.
    permissible_values:
      quality-attribute-spec:
        description: Named system quality attribute.
      feature-spec:
        description: Stakeholder-visible behavior grouped across specifications.
      capability-spec:
        description: An enabling ability and its explicit providers.
      component-spec:
        description: Named component specification.
      system-spec:
        description: System.
      job-spec:
        description: Job.
      quality-model-spec:
        description: Quality model.
      business-rule-spec:
        description: Business rule.
      use-case-spec:
        description: Use case.
      concept-spec:
        description: Concept.
      requirement-spec:
        description: Requirement.
  RelationshipCategory:
    description: Vocabulary of the relationship_category annotation on record-reference fields. Each category
      supplies the scope, cycle policy and basis of its fields unless a field states its own.
    permissible_values:
      declaration-containment:
        title: Declaration containment
        description: A declaration and its owned members; source-local, with checked owner backlinks.
        annotations:
          relationship_scope: Exactly one declaring owner in the same source document.
          relationship_cycles: forbidden
          relationship_basis: Explicit Markdown decomposition under the declared mapping profile.
      structural-context:
        title: Structural context
        description: Directory-derived discovery context; no structural decomposition or semantic inheritance.
        annotations:
          relationship_scope: Nearest inspected enclosing system according to directory discovery; no semantic
            inheritance.
          relationship_cycles: forbidden
          relationship_basis: Directory-derived association under the recorded discovery policy.
      semantic-association:
        title: Semantic association
        description: Explicit domain claims with typed targets and relationship-specific scope.
        annotations:
          relationship_scope: Explicit acquired targets; cross-system references are permitted.
          relationship_cycles: permitted
          relationship_basis: Projection of explicit authored references; no semantic inference from prose.
      contextual-citation:
        title: Contextual citation
        description: Authored reference occurrences; citations alone do not establish domain claims.
        annotations:
          relationship_scope: Authored occurrences in the containing domain record source; targets may remain
            unresolved.
          relationship_cycles: not-applicable
          relationship_basis: Explicit source syntax. Only separately declared semantic fields establish domain
            associations.
      derived-projection:
        title: Derived projection
        description: Optional assertion endpoints projected from canonical fields.
        annotations:
          relationship_scope: Typed endpoints of the canonical relationship identified by projection_path.
          relationship_cycles: not-applicable
          relationship_basis: Deterministic projection; assertions are optional views.
      provenance:
        title: Source and inspection provenance
        description: Evidence linking model records, source occurrences and inspection results.
        annotations:
          relationship_scope: Records in this snapshot; source locations retain their original document scope.
          relationship_cycles: not-applicable
          relationship_basis: Recorded source or inspection evidence.
      representation:
        title: Document representation
        description: Syntax structure and indexes, rather than domain ownership.
        annotations:
          relationship_scope: Same source document; syntax parents and children must agree.
          relationship_cycles: not-applicable
          relationship_basis: Parsed syntax or mapped element index.
