          belong in Rationale and should be identified as preferences.
  OpenQuestion:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: An explicitly authored unresolved question; do not infer every omitted field to be an open
      question.
    attributes:
      question:
        range: RichContent
        inlined: true
  ContextualReferences:
    in_subset:
    - specification-traceability
    description: Contextual citations of related specifications or other explicit targets, including the prose
      explaining their context. Links alone do not imply authority, support or verification relations.
    attributes:
      content:
        range: RichContent
        inlined: true
        required: true
      references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
  SourceReference:
    in_subset:
    - specification-traceability
    description: An authored reference occurrence, independent of whether it resolves or carries semantic intent.
    is_a: Record
    slot_usage:
      kind:
        equals_string: SourceReference
    attributes:
      span:
        range: ByteSpan
        inlined: true
        required: true
      source_document:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      form:
        range: ReferenceForm
        required: true
      authored_target:
        range: string
        description: Literal destination or label, including fragments; do not replace it with a normalized
          target.
        required: true
      context_owner:
        range: DomainElement
        annotations:
          relationship_category: provenance
          relationship_scope: The domain record in the reference source_document to which context_field applies.
      context_field:
        range: string
      role:
        range: string
        description: Declared relationship field on context_owner. Ordinary citations omit the role.
      resolution:
        range: Resolution
        inlined: true
  LabelOccurrence:
    in_subset:
    - specification-traceability
    description: An authored semantic classification or parent label, preserved even when no target can be
      bound.
    is_a: Record
    slot_usage:
      kind:
        equals_string: LabelOccurrence
    attributes:
      span:
        range: ByteSpan
        inlined: true
        required: true
      owner:
        range: DomainElement
        required: true
        any_of:
        - range: Requirement
        - range: QualityAttribute
        annotations:
          relationship_category: provenance
          relationship_scope: Requirement for a quality-classification label, or QualityAttribute for a sub-attribute
            label; retained in the corresponding occurrence list.
      role:
        range: LabelRole
        required: true
      label:
        range: string
        required: true
      resolution:
        range: Resolution
        inlined: true
      governing_system:
        range: System
        description: System whose declared quality attributes govern this label, if established. This is the
          declaring System or the specification system of a classified requirement, or the System declaring a
          sub-attribute.
        annotations:
          relationship_category: provenance
      governing_quality_model:
        range: QualityModel
        description: Quality model whose definitions govern a parent label on a reusable definition; never
          used for requirement classification.
        annotations:
          relationship_category: provenance
  Resolution:
    in_subset:
    - specification-traceability
    description: The recorded outcome of resolving one authored reference or label; targets need not be domain
      entities.
    attributes:
      status:
        range: ResolutionStatus
        required: true
      target:
        range: Record
        description: Only for resolved; target may be a domain element, source resource or source fragment.
        any_of:
        - range: DomainElement
        - range: SourceResource
        - range: SourceFragment
        annotations:
          relationship_category: provenance
      candidates:
        range: Record
        description: Candidates for an ambiguous resolution.
        multivalued: true
        annotations:
          relationship_category: provenance
      rule:
        range: string
        required: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
  Diagnostic:
    in_subset:
    - inspection
    description: A parser, mapper, resolver or graph-check finding. It may identify a source without
      any line, element or parsed document.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Diagnostic
    attributes:
      code:
        range: string
        required: true
      severity:
        range: Severity
        required: true
      message:
        range: string
        required: true
      source:
        range: SourceDocument
        annotations:
          relationship_category: provenance
      span:
        range: ByteSpan
        inlined: true
      record:
        range: Record
        annotations:
          relationship_category: provenance
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      phase:
        range: string
        description: Read, parse, map, resolve or graph; retain the producing subsystem.
        required: true
      element:
        range: string
        description: Authored source element named by the native diagnostic, when available.
      related:
        range: SourceLocation
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Related native source locations, preserving their original order and optional coordinates.
  DiscoveryPolicy:
    in_subset:
    - inspection
    description: Recorded discovery bounds. Current dotspec uses git or filesystem mode and excludes symlinks
      and nested repositories.
    attributes:
      mode:
        range: DiscoveryMode
        required: true
      rule:
        range: string
        description: Versioned discovery policy identifier.
        required: true
      follow_symlinks:
        range: boolean
        required: true
      include_nested_repositories:
        range: boolean
        required: true
  ReferenceTraversal:
    in_subset:
    - inspection
    description: Recorded reference traversal, independent of file discovery and domain semantic relations.
    attributes:
      mode:
        range: ReferenceTraversalMode
        required: true
      include_system_context:
        range: boolean
        required: true
      follow_external_resources:
        range: boolean
        required: true
      repository_bounded:
        range: boolean
        required: true
      maximum_depth:
        range: integer
        minimum_value: 0
      rule:
        range: string
        required: true
  ContextSource:
    in_subset:
    - inspection
    description: A consulted context source and the reason it entered the snapshot.
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      role:
        range: ContextSourceRole
        required: true
      requested_by:
        range: SourceDocument
        multivalued: true
        annotations:
          relationship_category: provenance
      reference_occurrences:
        range: SourceReference
        multivalued: true
        annotations:
          relationship_category: provenance
      rule:
        range: string
        required: true
  SourceDirectory:
    in_subset:
    - source-artifacts
    description: An addressable local directory referenced by Markdown. It is a resource target, not a document
      and carries a directory path.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDirectory
    attributes:
      locator:
        range: string
        required: true
  SourceLocation:
    in_subset:
    - source-artifacts
    description: A diagnostic source location, including path-only or external-to-snapshot locations without
      invented coordinates.
    attributes:
      source:
        range: SourceDocument
        annotations:
          relationship_category: provenance
      locator:
        range: string
      line:
        range: integer
        minimum_value: 1
      column:
        range: integer
        minimum_value: 1
      element:
        range: string
      span:
        range: ByteSpan
        inlined: true
  Component:
    in_subset:
    - software-requirements
    is_a: SystemContextSpecification
    description: A named part of a system with a described responsibility and boundary. Neither its declaration
      nor code location establishes structural parentage.
    slot_usage:
      kind:
        equals_string: Component
    attributes:
      concept_uses:
        range: ConceptUse
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: ConceptUse.owner
      synchronizations:
        range: Synchronization
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: Synchronization.owner
      out_of_scope:
        range: RichContent
        inlined: true
        description: Explicit boundary exclusions; absence is not a statement of scope.
      required_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: requires interface
        description: Services this subject expects from its environment.
      provided_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: provides interface
        description: Services this subject exposes to its environment.
      interacts_with:
        range: DomainElement
        multivalued: true
        description: Explicit interaction partners across this subject boundary; does not establish structural
          containment.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Interacts with
        any_of:
        - range: System
        - range: Component
      interacts_with_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the interacts with relationship.
      description:
        range: RichContent
        inlined: true
        description: The role this component plays in its system.
      purpose:
        range: RichContent
        inlined: true
        description: Benefit or reason for this component to exist.
      overview:
        range: RichContent
        inlined: true
        description: An explanation of what this component is and how its parts fit together, for a reader new to it.
          It explains without committing; verifiable obligations remain requirements.
      responsibilities:
        range: RichContent
        inlined: true
        description: Authored responsibilities identifying what this component is expected to do.
      boundary_description:
        range: RichContent
        inlined: true
        description: What the component includes, excludes and delegates; normative commitments remain requirements.
      part_of:
        range: DomainElement
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          relationship_scope: Explicit parent in the same project, identified by the component source.
          relationship_cycles: forbidden
          relationship_basis: Projection of explicit authored reference occurrences.
        any_of:
        - range: System
        - range: Component
        description: System or Component identified by the required Part of link, when resolved. The parent chain must be acyclic.
      part_of_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the part of relationship.
      contracts:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
      architecture:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
      implementation:
        range: ContextualReferences
        inlined: true
        description: Links and narrative; external native artifacts remain authoritative. No implementation
          or satisfaction claim is inferred.
    annotations:
      owned_memberships: Component.concept_uses or Component.synchronizations or Component.required_interfaces or Component.provided_interfaces
  Feature:
    in_subset:
    - software-requirements
    is_a: SystemContextSpecification
    description: A recognizable grouping of specified product behavior valued by stakeholders, independent
      of component structure. Membership does not duplicate or own requirements.
    slot_usage:
      kind:
        equals_string: Feature
    attributes:
      description:
        range: RichContent
        inlined: true
        description: The behavior available through this feature.
      purpose:
        range: RichContent
        inlined: true
        description: Stakeholder benefit expressed by this feature.
      overview:
        range: RichContent
        inlined: true
        description: An explanation of how the grouped behavior works together for stakeholders, for a reader new
          to it. It explains without committing; verifiable obligations remain requirements.
      groups:
        range: DomainElement
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          relationship_scope: Authored specification membership; many-to-many and independent of ownership.
          relationship_basis: Projection of explicit authored reference occurrences.
        any_of:
        - range: Requirement
        - range: UseCase
        - range: Concept
        - range: ConceptUse
        - range: Synchronization
        - range: Interface
        multivalued: true
        description: Non-owning specification membership; the same record may participate in several features.
      groups_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the groups relationship.
  Capability:
    in_subset:
    - business-requirements
    - software-requirements
    is_a: SystemContextSpecification
    description: An ability needed to deliver value, potentially combining people, procedures and technology.
      Distinct from a product feature or structural component; its declaration does not establish a provider.
    slot_usage:
      kind:
        equals_string: Capability
    attributes:
      description:
        range: RichContent
        inlined: true
        description: The ability this system or organization provides.
      purpose:
        range: RichContent
        inlined: true
        description: What this ability enables and why it matters.
      enablers:
        range: RichContent
        inlined: true
        description: Human, procedural or other enabling context, including external references. Typed providers
          describe only explicitly linked systems and components.
      depends_on:
        range: Capability
        multivalued: true
        description: Capabilities required by this capability; many-to-many dependencies may be cyclic. Not
          structural containment or an inferred execution sequence.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Depends on
      depends_on_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the depends on relationship.
      provided_by:
        range: DomainElement
        multivalued: true
        description: 'Explicitly identified system or component providers. Optional and non-exhaustive: human
          and procedural providers can be described in enablers. Does not assert verified implementation or
          satisfaction.'
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Provided by
        any_of:
        - range: System
        - range: Component
      provided_by_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the provided by relationship.
  Interface:
    in_subset:
    - software-requirements
    is_a: TraceableElement
    description: An independently addressable description of interaction at a System or Component boundary,
      declared by that System or Component. Required or provided membership states direction relative to the
      declaring subject. Native protocol contracts retain their authority; neither declaration nor citation
      proves implementation or compatibility.
    slot_usage:
      kind:
        equals_string: Interface
    annotations:
      owned_memberships: Interface.adopts
    attributes:
      adopts:
        range: AdoptedProvision
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: AdoptedProvision.owner
      owner:
        range: DomainElement
        any_of:
        - range: System
        - range: Component
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Checked inverse of canonical declaration membership.
          relationship_inverse: System.required_interfaces or System.provided_interfaces or Component.required_interfaces
            or Component.provided_interfaces
          relationship_label: declared by
      content:
        range: RichContent
        inlined: true
        required: true
      description:
        range: RichContent
        inlined: true
        description: Introductory description of the boundary interaction.
      contracts:
        range: ContextualReferences
        inlined: true
        description: References to authoritative native contracts; no conformance claim is inferred.
      counterpart:
        range: ContextualReferences
        inlined: true
        description: Contextual references to participants or corresponding interfaces; no compatibility claim
          is inferred.
enums:
  ReadStatus:
    description: Whether the source was successfully read.
    permissible_values:
      read:
        description: The source was read successfully.
      failed:
        description: Read attempted but failed; diagnostic retained.
      not_attempted:
        description: Source discovered but not read.
  ParseStatus:
    description: Syntax or frontmatter parse state, independent of domain decomposition.
    permissible_values:
      parsed:
        description: Supported syntax parsed; opaque unsupported syntax may still exist.
      partial:
        description: Some syntax parsed and some malformed or uninterpreted.
      failed:
        description: Parsing failed; normalized text remains available.
      not_attempted:
        description: No syntax parse attempted.
  ReferenceForm:
    description: Authored reference notation.
    permissible_values:
      inline_link:
        description: Inline link.
      reference_link:
        description: Reference link.
      autolink:
        description: Autolink.
      image:
        description: Image.
      footnote:
        description: Footnote.
      fragment:
        description: Fragment.
      explicit_id:
        description: Explicit id.
      external_locator:
        description: External locator.
  ResolutionStatus:
    description: Resolution results, not extraction/decomposition states.
    permissible_values:
      invalid_target:
        description: The link resolves to an ineligible endpoint for its declared domain role.
      resolved:
        description: Exactly one inspected target identified.
      unresolved:
        description: An authored target was recognized but not found.
      undefined_label:
        description: A reference-style label lacks a definition, or a system's declared quality attributes
          lack the authored member label.
      unbound_label:
        description: A recognized semantic label has no governing quality attribute declaration.
      ambiguous:
        description: More than one target matches.
      external:
        description: Target is external and has not been inspected.
      out_of_scope:
        description: Target is known to be outside this snapshot scope.
      not_attempted:
        description: Resolution has not been attempted.
  LabelRole:
    description: Semantic label occurrences preserved before resolution.
    permissible_values:
      quality_classification:
        description: An requirement's quality attribute label.
      subattribute_of:
        description: A quality attribute parent label.
  Severity:
    description: Diagnostic severity.
    permissible_values:
      error:
        description: Failure.
      warning:
        description: Potential issue.
      advice:
        description: Non-failing advice.
      info:
        description: Informational result.
  DiscoveryMode:
    description: How candidate files were discovered.
    permissible_values:
      git:
        description: Repository discovery with Git ignore rules.
      filesystem:
        description: Filesystem discovery without Git ignore rules.
      explicit:
        description: An explicit supplied file inventory.
      unavailable:
        description: Discovery policy could not be established.
  ReferenceTraversalMode:
    description: Which authored reference edges are inspected.
    permissible_values:
      none:
        description: Do not follow references.
      direct:
        description: Follow one edge from selected documents and consulted context.
      transitive:
        description: Traverse multiple edges under explicit limits; not current dotspec behavior.
  ContextSourceRole:
    description: Why a source outside the selected candidates was consulted.
    permissible_values:
      project_configuration:
        description: Local dotspec.yaml declaring the selected project.
      glossary_source:
        description: Markdown vocabulary explicitly included by a system.
      system_context:
        description: Enclosing-system context required for inspection.
      reference_target:
        description: Directly referenced target supplies link/fragment context, not another scan.
      other:
        description: Other declared context, explained by rule.
  ReferenceType:
    description: Markdown frontmatter types for independently authored reference material.
    permissible_values:
      quality-model:
        description: Reusable quality model.
  SpecificationType:
    description: Markdown frontmatter types for authored specifications. Each
      type has exactly one concrete Specification class.
    permissible_values:
      quality-attribute-spec:
        description: Named system quality attribute.
      feature-spec:
        description: Stakeholder-visible behavior grouped across specifications.
      capability-spec:
        description: An enabling ability and its explicit providers.
      component-spec:
        description: Named component specification.
      system-spec:
        description: System.
      job-spec:
        description: Job.
      business-rule-spec:
        description: Business rule.
      use-case-spec:
        description: Use case.
      concept-spec:
        description: Concept.
      requirement-spec:
        description: Requirement.
  RelationshipCategory:
    description: Vocabulary of the relationship_category annotation on record-reference fields. Each category
      supplies the scope, cycle policy and basis of its fields unless a field states its own.
    permissible_values:
      system-membership:
        title: System membership
        description: Associates an independently authored specification with its effective system.
        annotations:
          relationship_scope: The effective system of the specification.
          relationship_cycles: permitted
          relationship_basis: Explicit selection or source layout.
      declaration-containment:
        title: Declaration containment
        description: A declaration and its owned members; source-local, with checked owner backlinks.
        annotations:
          relationship_scope: Exactly one declaring owner in the same source document.
          relationship_cycles: forbidden
          relationship_basis: Explicit Markdown decomposition under the declared mapping profile.
      structural-context:
        title: Structural context
        description: Directory-derived discovery context; no structural decomposition or semantic inheritance.
        annotations:
          relationship_scope: Nearest inspected enclosing system according to directory discovery; no semantic
            inheritance.
          relationship_cycles: forbidden
          relationship_basis: Directory-derived association under the recorded discovery policy.
      semantic-association:
        title: Semantic association
        description: Explicit domain claims with typed targets and relationship-specific scope.
        annotations:
          relationship_scope: Explicit acquired targets; cross-system references are permitted.
          relationship_cycles: permitted
          relationship_basis: Projection of explicit authored references; no semantic inference from prose.
      contextual-citation:
        title: Contextual citation
        description: Authored reference occurrences; citations alone do not establish domain claims.
        annotations:
          relationship_scope: Authored occurrences in the containing domain record source; targets may remain
            unresolved.
          relationship_cycles: not-applicable
          relationship_basis: Explicit source syntax. Only separately declared semantic fields establish domain
            associations.
      provenance:
        title: Source and inspection provenance
        description: Evidence linking model records, source occurrences and inspection results.
        annotations:
          relationship_scope: Records in this snapshot; source locations retain their original document scope.
          relationship_cycles: not-applicable
          relationship_basis: Recorded source or inspection evidence.
      representation:
        title: Document representation
        description: Syntax structure and indexes, rather than domain ownership.
        annotations:
          relationship_scope: Same source document; syntax parents and children must agree.
          relationship_cycles: not-applicable
          relationship_basis: Parsed syntax or mapped element index.
