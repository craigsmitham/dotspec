      assumptions:
        range: Assumption
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: Assumption.owner
          relationship_label: items
          paired_with: assumptions_content
        description: Explicitly authored assumptions, in authored order.
      constraints:
