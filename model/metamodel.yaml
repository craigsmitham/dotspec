id: https://github.com/craigsmitham/dotspec/model/metamodel.yaml
name: dotspec_metamodel
title: Dotspec specification metamodel
version: 0.34.0-draft
description: Source-backed specifications and their reader-facing reports. Domain fields retain the authored
  Markdown through ordered byte ranges. Explicit declarations, links and classification labels supply identity
  and relationships.
prefixes:
  ds: https://github.com/craigsmitham/dotspec/model/
  linkml: https://w3id.org/linkml/
default_prefix: ds
default_range: string
imports:
- linkml:types
annotations:
  status: experimental
  runtime_target: Generated JSON Schema plus explicit graph checks; no generated-Go reliance.
  graph_rules: The validator checks record identity, source range bounds and ownership, declaration membership,
    typed endpoints, resolution status, classification scope and relationship cycles.
  relationship_defaults: 'Relationship fields name a RelationshipCategory. Its scope, cycle policy and basis
    apply unless a field states its own. An unstated inverse is none, an unstated label is the field name,
    and unstated ordering follows the field shape: single target, authored presentation order for ordered lists,
    otherwise unordered.'
subsets:
  business-requirements:
    title: Business requirements
    description: Business objectives, scope, assumptions, and rules governing permissible business activity.
    annotations:
      classification: core
  user-requirements:
    title: User requirements
    description: The progress people seek, their circumstances, work, and desired outcomes.
    annotations:
      classification: core
  software-requirements:
    title: Software requirements
    description: Software interactions, concept behavior, requirements, quality classifications and satisfaction criteria.
    annotations:
      classification: core
  specification-traceability:
    title: Specification traceability
    description: Explicit connections between specification meaning, authored occurrences, and resolved relationships.
    annotations:
      classification: core
  specification-documentation:
    title: Specification documentation
    description: Roles, reader-facing content, and navigation of generated requirements documents.
    annotations:
      classification: supporting
  inspection:
    title: Inspection
    description: The scope, completion and diagnostics of an inspection.
    annotations:
      classification: supporting
  document-content:
    title: Document content
    description: Normalized Markdown and located passages.
    annotations:
      classification: generic
  source-artifacts:
    title: Source artifacts
    description: Source identities, normalized Markdown, fragments, and locations.
    annotations:
      classification: generic
classes:
  GeneratedDocument:
    abstract: true
    in_subset: [specification-documentation]
    description: A reader-facing document rendered as a Markdown page or an addressable section.
    attributes:
      type:
        required: true
        range: string
        description: Serialized document type fixed by the concrete class.
  SubjectReport:
    abstract: true
    is_a: GeneratedDocument
    in_subset: [specification-documentation]
    description: The canonical generated account of one addressable subject in the selected snapshot.
    attributes:
      documents:
        required: true
        range: DomainElement
        description: The documented subject, serialized as a relative URI to its authored heading.
        annotations:
          relationship_category: semantic-association
          relationship_scope: One selected subject of the concrete document's corresponding domain class.
          relationship_basis: Identity of the domain record mapped from the referenced heading.
  SystemSpecReport:
    is_a: SubjectReport
    description: Explains the system’s purpose, boundary, setting and the premises its specification relies on.
      Links to its immediate child systems, local subjects and requirements.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: system-spec-report
      documents:
        range: System
  RequirementSpecReport:
    is_a: SubjectReport
    description: Brings the requirement statement, applicability and criterion together at one address.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: requirement-spec-report
      documents:
        range: Requirement
  ComponentSpecReport:
    is_a: SubjectReport
    description: Explains the component’s responsibilities and links to its structural children, declared interfaces, and explicitly applicable requirements.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: component-spec-report
      documents:
        range: Component
  FeatureSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: feature-spec-report
      documents:
        range: Feature
  CapabilitySpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: capability-spec-report
      documents:
        range: Capability
  ConceptUseSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-use-spec-report
      documents:
        range: ConceptUse
  InterfaceSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: interface-spec-report
      documents:
        range: Interface
  SynchronizationSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: synchronization-spec-report
      documents:
        range: Synchronization
  QualityModelReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: quality-model-report
      documents:
        range: QualityModel
  QualityModelAttributeReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: quality-model-attribute-report
      documents:
        range: QualityModelAttribute
  AdoptedProvisionReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: adopted-provision-report
      documents:
        range: AdoptedProvision
  BusinessRuleSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: business-rule-spec-report
      documents:
        range: BusinessRule
  JobSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: job-spec-report
      documents:
        range: Job
  UseCaseSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: use-case-spec-report
      documents:
        range: UseCase
  ConceptSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-spec-report
      documents:
        range: Concept
  SystemQualityAttributeSpecReport:
    is_a: SubjectReport
    description: Defines one quality attribute and links to the requirements classified by it.
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: system-quality-attribute-spec-report
      documents:
        range: SystemQualityAttribute
  SystemStakeholderRoleSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    description: The role’s addressable passage within its owning System report.
    slot_usage:
      type:
        equals_string: system-stakeholder-role-spec-report
      documents:
        range: SystemStakeholderRole
  GoalSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: goal-spec-report
      documents:
        range: Goal
  AssumptionSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: assumption-spec-report
      documents:
        range: Assumption
  GlossaryTermSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: glossary-term-spec-report
      documents:
        range: GlossaryTerm
  ScenarioSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: scenario-spec-report
      documents:
        range: Scenario
  UseCaseExtensionSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: use-case-extension-spec-report
      documents:
        range: UseCaseExtension
  JobStepSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: job-step-spec-report
      documents:
        range: JobStep
  DesiredOutcomeSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: desired-outcome-spec-report
      documents:
        range: DesiredOutcome
  ConceptActionSpecReport:
    is_a: SubjectReport
    in_subset: [specification-documentation]
    slot_usage:
      type:
        equals_string: concept-action-spec-report
      documents:
        range: ConceptAction
  Record:
    in_subset:
    - source-artifacts
    description: An addressable record in one snapshot. All IDs are unique across snapshot collections.
    abstract: true
    attributes:
      id:
        range: string
        description: Required snapshot-local record identity; does not require a globally stable authored ID.
        required: true
        identifier: true
        pattern: '[\s\S]+'
      kind:
        range: string
        description: Concrete record type discriminator.
        required: true
  Snapshot:
    in_subset:
    - inspection
    description: A bounded and potentially incomplete observation of source documents and their mapped domain
      content.
    attributes:
      model_version:
        range: string
        required: true
        equals_string: 0.34.0-draft
      mapping_profile:
        range: string
        description: Versioned rules for mapping declared sections, metadata and references.
        required: true
      scope:
        range: ScanScope
        required: true
        inlined: true
      sources:
        range: SourceResource
        required: true
        multivalued: true
        inlined_as_list: true
      documents:
        range: Document
        required: true
        multivalued: true
        inlined_as_list: true
      fragments:
        range: SourceFragment
        multivalued: true
        inlined_as_list: true
      elements:
        range: DomainElement
        required: true
        multivalued: true
        inlined_as_list: true
      references:
        range: SourceReference
        multivalued: true
        inlined_as_list: true
      label_occurrences:
        range: LabelOccurrence
        multivalued: true
        inlined_as_list: true
      diagnostics:
        range: Diagnostic
        multivalued: true
        inlined_as_list: true
      representation_version:
        range: string
        description: Version of this serialized snapshot contract, separate from the domain metamodel version.
        required: true
        equals_string: 0.4.0
      context_sources:
        range: ContextSource
        multivalued: true
        inlined_as_list: true
    tree_root: true
  SpecificationProject:
    in_subset:
    - inspection
    description: A tooling partition rooted at the directory containing its dotspec.yaml.
    attributes:
      root:
        range: string
        required: true
      name:
        range: string
        required: true
  ScanScope:
    in_subset:
    - inspection
    description: Declared scan boundary and completion, independently of whether individual documents are valid.
    attributes:
      project:
        range: SpecificationProject
        inlined: true
        description: Selected tooling project, independent of domain System relationships.
      roots:
        range: string
        required: true
        multivalued: true
      discovery_complete:
        range: boolean
        required: true
      reads_complete:
        range: boolean
        required: true
      inspection_complete:
        range: boolean
        required: true
      limitations:
        range: string
        multivalued: true
      selected_spec_types:
        range: SpecificationType
        required: true
        multivalued: true
        description: Specification types selected for this inspection.
      selected_reference_types:
        range: ReferenceType
        multivalued: true
        description: Reference document types selected for this inspection.
      discovery_policy:
        range: DiscoveryPolicy
        required: true
        inlined: true
      reference_traversal:
        range: ReferenceTraversal
        required: true
        inlined: true
  SourceResource:
    in_subset:
    - source-artifacts
    description: An addressable source; a SourceDocument records the outcome of a local read.
    is_a: Record
    abstract: true
  SourceDocument:
    in_subset:
    - source-artifacts
    description: A discovered Markdown or related file. A failed read retains identity, locator, status and
      diagnostics.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: SourceDocument
    attributes:
      selected:
        range: boolean
        description: True for authored files selected by discovery in the scan scope. Context acquired
          through references or enclosing system lookup is excluded from the selected set.
      project:
        range: SpecificationProject
        inlined: true
        description: Project whose manifest is nearest to this acquired source.
      locator:
        range: string
        required: true
      read_status:
        range: ReadStatus
        required: true
      media_type:
        range: string
      markdown:
        range: string
        description: Markdown text for parsed documents, normalized to UTF-8 and LF for reading and source locations.
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
  ExternalResource:
    in_subset:
    - source-artifacts
    description: An external address explicitly mentioned by source; no implied fetch or trust.
    is_a: SourceResource
    slot_usage:
      kind:
        equals_string: ExternalResource
    attributes:
      locator:
        range: string
        required: true
      media_type:
        range: string
  ByteSpan:
    in_subset:
    - source-artifacts
    description: Half-open [start,end) offsets into UTF-8 bytes of the normalized Markdown text. Graph checks enforce
      bounds and start <= end.
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      start:
        range: integer
        required: true
        minimum_value: 0
      end:
        range: integer
        required: true
        minimum_value: 0
  Document:
    in_subset:
    - document-content
    description: Syntax and interpretation state for an acquired document, separate from its SourceDocument
      read state.
    is_a: Record
    slot_usage:
      kind:
        equals_string: Document
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      parse_status:
        range: ParseStatus
        required: true
      declared_type:
        range: string
        description: Declared metadata type, exactly as authored; original key/value syntax remains in the
          tree. A recognized value is a SpecificationType or ReferenceType.
      authored_id:
        range: string
        description: Interpreted document ID when available; invalid metadata remains in the tree and diagnostics.
      elements:
        range: DomainElement
        description: Domain elements declared in this document.
        multivalued: true
        annotations:
          relationship_category: representation
          relationship_scope: Mapped elements of the same source document. Document-owned glossary terms have a separate glossary_terms membership.
      diagnostics:
        range: Diagnostic
        multivalued: true
        annotations:
          relationship_category: provenance
      glossary_context:
        range: string
        description: Optional name of the context in which this vocabulary defines its terms.
      glossary_terms:
        range: GlossaryTerm
        multivalued: true
        list_elements_ordered: true
        description: Terms defined by the level-two headings of a declared Markdown glossary source.
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: GlossaryTerm.owner
    annotations:
      owned_memberships: Document.glossary_terms
  SourceFragment:
    in_subset:
    - source-artifacts
    description: An addressable heading, explicit anchor, or occurrence in a source document, without implying
      domain-element identity.
    is_a: Record
    slot_usage:
      kind:
        equals_string: SourceFragment
    attributes:
      source:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      span:
        range: ByteSpan
        inlined: true
      authored_anchor:
        range: string
      generated_anchor:
        range: string
      anchor_rule:
        range: string
  RichContent:
    in_subset: [document-content]
    description: Ordered ranges in the owner's normalized Markdown. An empty list records an explicitly empty field.
    attributes:
      spans:
        range: ByteSpan
        inlined_as_list: true
        multivalued: true
        list_elements_ordered: true
        required: true
  DomainElement:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: A source-backed semantic record. Snapshot IDs are required; authored IDs remain optional except
      where the source format requires them.
    is_a: Record
    abstract: true
    attributes:
      authored_id:
        range: string
        description: An explicitly authored ID when present; no manufactured global identifier.
      source_document:
        range: SourceDocument
        required: true
        annotations:
          relationship_category: provenance
      name:
        range: RichContent
        description: Authored title or item name, if present.
        inlined: true
      source_fragment:
        range: SourceFragment
        annotations:
          relationship_category: provenance
      open_questions:
        range: OpenQuestion
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
        description: Explicitly distinguished questions, in authored order.
  TraceableElement:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: An element with explicit motivation, derivation and assumptions. Concern subset, artifact
      kind and core/supporting/generic classification are independent; neither traceability nor document location
      confers normative authority.
    is_a: DomainElement
    abstract: true
    attributes:
      supports:
        range: DomainElement
        multivalued: true
        description: Intended contribution to a goal, user progress or a higher-level use case; does not assert
          achievement.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Supports
        any_of:
        - range: Goal
        - range: Job
        - range: JobStep
        - range: DesiredOutcome
        - range: UseCase
      supports_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the supports relationship.
      derived_from:
        range: Record
        multivalued: true
        description: Source or rationale for this element, including rules, decisions and requirements; not
          logical entailment.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Derived from
        any_of:
        - range: DomainElement
        - range: SourceFragment
      derived_from_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the derived from relationship.
      relies_on:
        range: Assumption
        multivalued: true
        description: Assumptions on which the validity of this element depends.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Relies on
      relies_on_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the relies on relationship.
  AuthoredDocumentRoot:
    abstract: true
    is_a: DomainElement
    in_subset: [document-content]
    description: The primary domain subject of an independently authored document.
    attributes:
      slug:
        range: string
        description: Path-derived current slug where applicable.
      preamble:
        range: RichContent
        description: Authored content between the title and the first named section.
        inlined: true
  Specification:
    abstract: true
    is_a: AuthoredDocumentRoot
    mixins: [TraceableElement]
    in_subset: [business-requirements, user-requirements, software-requirements]
    description: An independently maintained aggregate of product intent. Each authored specification file
      declares one root and can contain addressable parts. The specifications in product scope and their
      relationships compose the product specification.
    annotations:
      owned_memberships: Specification.adopts
    attributes:
      adopts:
        range: AdoptedProvision
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: AdoptedProvision.owner
      related_specifications:
        range: ContextualReferences
        inlined: true
        description: Contextual citations of related specifications of any type, with their explanation; no
          implicit support, refinement, enforcement or compliance relation.
      authority_and_evidence:
        range: RichContent
        description: Authored authority for the specification.
        inlined: true
      evidence:
        range: RichContent
        inlined: true
  AdoptedProvision:
    in_subset: [software-requirements]
    is_a: DomainElement
    description: The local decision to adopt an identified external provision under stated conditions.
    slot_usage:
      kind:
        equals_string: AdoptedProvision
    attributes:
      owner:
        range: DomainElement
        any_of:
        - range: Specification
        - range: Interface
        required: true
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: Specification.adopts or Interface.adopts
      provision:
        range: SourceReference
        required: true
        annotations:
          relationship_category: provenance
          relationship_basis: The exact link occurrence in the local adoption declaration.
      observed_source_sha256:
        range: string
        pattern: '^[a-f0-9]{64}$'
        description: Digest of the acquired provision document for change review. Markdown uses normalized source text.
      edition:
        range: RichContent
        inlined: true
        required: true
        description: The pinned edition or revision, or the word evolving for a moving reference.
      applicability:
        range: RichContent
        inlined: true
        required: true
  SystemContextSpecification:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: A specification associated with a system selected explicitly or supplied by directory discovery.
    is_a: Specification
    abstract: true
    attributes:
      directory_system:
        range: System
        description: Governing system supplied by directory discovery when the author did not select a system.
        annotations:
          relationship_category: structural-context
      specification_owner:
        range: Specification
        any_of:
        - range: System
        - range: Component
        description: Nearest system or component used for source lookup within the project.
        annotations:
          relationship_category: structural-context
      specification_system:
        range: System
        annotations:
          occurrence_role: link
          relationship_category: system-membership
          relationship_scope: Explicit selection, or nearest enclosing system when no selection was authored.
          relationship_basis: Explicit Specification system reference when present; otherwise the nearest enclosing
            system found by directory discovery.
        description: System association for inventory grouping and quality classification. An explicit selection
          takes precedence over the directory default; an invalid selection never falls back.
      specification_system_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the specification system relationship.
  BusinessRule:
    in_subset:
    - business-requirements
    description: A declarative business constraint independent of the software or process that enforces it.
    is_a: SystemContextSpecification
    slot_usage:
      kind:
        equals_string: BusinessRule
    attributes:
      statement:
        description: The rule expressed in business language, independently of enforcement.
        range: RichContent
        inlined: true
      applies_to:
        range: DomainElement
        multivalued: true
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          relationship_scope: Explicitly referenced acquired domain records; cross-system links are permitted.
          relationship_basis: Projection of explicit authored reference or label occurrences.
      applicability:
        range: Applicability
        inlined: true
      rationale:
        range: RichContent
        inlined: true
      exceptions:
        description: Authored qualifications or references to exception rules; no inferred exemption.
        range: RichContent
        inlined: true
      refines:
        range: BusinessRule
        multivalued: true
        description: Adds precision while preserving the referenced rule; not replacement, duplication or proof.
          Multiple parents are permitted.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          relationship_cycles: forbidden
          trace_heading: Refines
      refines_content:
        range: RichContent
        inlined: true
        description: Authored Markdown qualifying the refines relationship.
  QualityModel:
    in_subset:
    - software-requirements
    description: A reference vocabulary of reusable quality attribute definitions. Copying creates independent system
      declarations; no live inheritance or synchronization.
    is_a: AuthoredDocumentRoot
    slot_usage:
      kind:
        equals_string: QualityModel
    attributes:
      description:
        range: RichContent
        inlined: true
      edition:
        range: RichContent
        inlined: true
      sources:
        range: ContextualReferences
        inlined: true
      quality_attributes:
        range: QualityModelAttribute
        multivalued: true
        list_elements_ordered: true
        description: Definitions in declaration order.
        annotations:
          relationship_category: declaration-containment
          relationship_inverse: QualityModelAttribute.owner
          relationship_label: declares
    annotations:
      owned_memberships: QualityModel.quality_attributes
  System:
    in_subset:
    - business-requirements
    - software-requirements
    description: The system described by a system document; subordinate systems retain their own boundaries
      and quality attributes.
    is_a: Specification
    slot_usage:
      kind:
        equals_string: System
    attributes:
      project_references:
        range: ContextualReferences
        inlined: true
        description: Plans, responsibilities, risks and delivery decisions that affect this system,
          with prose explaining their relevance and links to the records the team maintains.
      out_of_scope:
        range: RichContent
        inlined: true
        description: Work, users or situations explicitly excluded from this system’s responsibility.
          Omission leaves scope unspecified.
      required_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: requires interface
        description: Services this subject expects from its environment.
      provided_interfaces:
        range: Interface
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: declaration-containment
          relationship_scope: Exactly one declaring System or Component in the same source document.
          relationship_basis: Explicit named interface declarations under Required interfaces or Provided interfaces.
          relationship_inverse: Interface.owner
          relationship_label: provides interface
        description: Services this subject exposes to its environment.
      interacts_with:
        range: DomainElement
        multivalued: true
        description: Explicit interaction partners across this subject boundary; does not establish structural
          containment.
        annotations:
          occurrence_role: link
          relationship_category: semantic-association
          trace_heading: Interacts with
        any_of:
