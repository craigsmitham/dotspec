            system found by directory discovery.
          relationship_source: specification_system_content
        description: System association for inventory grouping and quality classification. An explicit selection
          takes precedence over the directory default; an invalid selection never falls back.
      specification_system_origin:
        range: SystemAssociationOrigin
        description: Records whether the association was explicitly selected or supplied by directory discovery.
  BusinessRule:
    in_subset:
