          relationship_basis: Projection of explicit authored reference or label occurrences.
      applicability:
        range: Applicability
        inlined: true
      rationale:
        range: RichContent
        inlined: true
      exceptions:
        description: Authored qualifications or references to exception rules; no inferred exemption.
        range: RichContent
        inlined: true
      refines_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      refines_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: refines_content
      refines:
        range: BusinessRule
        multivalued: true
        description: Adds precision while preserving the referenced rule; not replacement, duplication or proof.
          Multiple parents are permitted.
        annotations:
          relationship_category: semantic-association
          relationship_cycles: forbidden
          trace_heading: Refines
          trace_targets: BusinessRule
          requires_content: refines_content
  QualityModel:
    in_subset:
