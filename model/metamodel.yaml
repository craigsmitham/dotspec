        annotations:
          relationship_category: semantic-association
          trace_heading: Derived from
          trace_targets: DomainElement or SourceFragment
          requires_content: derived_from_content
        any_of:
        - range: DomainElement
        - range: SourceFragment
      relies_on_content:
        range: RichContent
        inlined: true
        description: Complete authored relationship section, including rationale and unresolved references.
      relies_on_references:
        range: SourceReference
        multivalued: true
        list_elements_ordered: true
        annotations:
          relationship_category: contextual-citation
          requires_content: relies_on_content
      relies_on:
        range: Assumption
        multivalued: true
        description: Assumptions on which the validity of this element depends.
        annotations:
          relationship_category: semantic-association
          trace_heading: Relies on
          trace_targets: Assumption
          requires_content: relies_on_content
  Specification:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: The root record of one authored specification document. Every specification has exactly one
      specification type, and specification types correspond one-to-one with concrete Specification classes.
      Elements declared inside a specification are not specifications. Narrative authority and evidence do
      not create executable authority assertions.
    is_a: TraceableElement
    abstract: true
    attributes:
      slug:
        range: string
        description: Path-derived current slug where applicable.
      related_specifications:
        range: ContextualReferences
        inlined: true
        description: Contextual citations of related specifications of any type, with their explanation; no
          implicit support, refinement, enforcement or compliance relation.
      authority_and_evidence:
        range: RichContent
        description: Maps both Authority and Authority and evidence headings; retain original heading nodes.
        inlined: true
      evidence:
        range: RichContent
        inlined: true
      preamble:
        range: RichContent
        description: Authored content between the title and the first named section.
        inlined: true
  SystemContextSpecification:
    in_subset:
    - business-requirements
    - user-requirements
    - software-requirements
    description: 'A specification associated with a system: every specification type other than System and
      QualityModel. The association is selected explicitly or defaults to the nearest enclosing system found
      by directory discovery.'
