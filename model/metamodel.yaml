        range: RichContent
        inlined: true
      aggregation:
        range: RichContent
        inlined: true
      window:
        range: RichContent
        inlined: true
      conditions:
        range: RichContent
        inlined: true
        description: Operating conditions qualifying this criterion within the obligation's applicability;
          not the conditions of an assessment run.
      workload:
        range: RichContent
        inlined: true
      population:
        range: RichContent
        inlined: true
      exclusions:
        range: RichContent
        inlined: true
  MeasurementPlan:
    in_subset:
    - software-requirements
    description: Optional measurement procedure for obtaining evidence against an obligation's statement
      or criterion. It may supply the whole verification approach; a second verification plan is not required.
      Required bounds belong to the statement or criterion, not to a competing measurement target.
    attributes:
      success_criteria:
        range: RichContent
        inlined: true
        description: How observations will be compared with the obligation's statement or criterion.
