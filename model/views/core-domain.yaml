diagrams:
- title: Specification and reference roots
  direction: TB
  show_cardinality: false
  description: Each authored document has one primary domain subject. A specification root records product
    intent and owns the elements declared within its file. A quality model is a reference root that owns
    reusable definitions.
  nodes:
  - AuthoredDocumentRoot
  - Specification
  - SystemContextSpecification
  - SystemQualityAttribute
  - Feature
  - Capability
  - System
  - Component
  - QualityModel
  - BusinessRule
  - Job
  - UseCase
  - Concept
  - Requirement
  paths: []
  inheritance: true
- title: Elements declared in system and component specifications
  description: Components link to their structural parents. Systems and components can each declare concept uses, synchronizations, and interfaces.
  nodes:
  - System
  - Component
  - ConceptUse
  - Synchronization
  - Interface
  paths:
  - Component.part_of
  - System.concept_uses
  - System.synchronizations
  - Component.concept_uses
  - Component.synchronizations
  - System.required_interfaces
  - System.provided_interfaces
  - Component.required_interfaces
  - Component.provided_interfaces
  inheritance: false
- title: Specification system association
  direction: TB
  show_cardinality: false
  description: A local specification records its owning component and effective system. Component parent links identify the default system. Quality models are project-wide.
  nodes:
  - System
  - Component
  - BusinessRule
  - Job
  - UseCase
  - Concept
  - Requirement
  paths:
  - BusinessRule.specification_system
  - Job.specification_system
  - UseCase.specification_system
  - Concept.specification_system
  - Requirement.specification_owner
  - Requirement.specification_system
  inheritance: false
- title: Boundary interfaces
  description: Required and provided are relative to the declaring System or Component. Each Interface is an
    addressable element with one declaration membership. Requirements can apply to it through explicit applicability. Native contract references do not establish implementation or compatibility.
  nodes:
  - System
  - Component
  - Interface
  paths:
  - System.required_interfaces
  - System.provided_interfaces
  - Component.required_interfaces
  - Component.provided_interfaces
  inheritance: false
- title: System structure and feature grouping
  description: Declaration membership identifies where records are authored. Explicit part_of identifies structural
    parents independently of directories. Features group specifications without owning them. Applicability
    identifies subjects; no implementation, allocation, inheritance or satisfaction is inferred. Interacts
    with identifies boundary partners, independently of structural parentage.
  nodes:
  - System
  - Component
  - Feature
  - Requirement
  - UseCase
  - Concept
  - ConceptUse
  - Synchronization
  - Interface
  - DomainElement
  paths:
  - System.part_of
  - Component.part_of
  - Feature.groups
  - Requirement.applies_to
  - System.interacts_with
  - Component.interacts_with
  inheritance: false
- title: User progress
  description: Jobs optionally declare functional steps and outcomes. These edges describe
    declaration ownership; step order is presentation order.
  nodes:
  - Job
  - JobStep
  - DesiredOutcome
  paths:
  - Job.steps
  - Job.outcomes
  - JobStep.outcomes
  inheritance: false
- title: Outcome applicability
  description: An outcome can explicitly apply to several jobs or steps independently of its single declaration
    owner. Applicability does not assert achievement.
  nodes:
  - DesiredOutcome
  - Job
  - JobStep
  paths:
  - DesiredOutcome.applies_to
  inheritance: false
- title: Software behavior
  description: Use cases describe interactions and alternatives; concepts describe purposeful state and actions.
    These are complementary views, with no mandatory authoring or execution order. Steps may explicitly illustrate
    requirements, business rules or actions; this does not prove completeness.
  nodes:
  - UseCase
  - Scenario
  - ScenarioStep
  - UseCaseExtension
  - Concept
  - ConceptAction
  - Requirement
  - BusinessRule
  paths:
  - UseCase.main_success_scenario
  - UseCase.extensions
  - Scenario.steps
  - UseCaseExtension.steps
  - Concept.actions
  - ScenarioStep.illustrates
  inheritance: false
- title: Quality classification
  description: A quality model owns reusable definitions. Independent system quality attributes classify requirements
    within their effective system. Both kinds support acyclic grouping within their own scope.
  nodes:
  - System
  - QualityModel
  - QualityModelAttribute
  - SystemQualityAttribute
  - Requirement
  paths:
  - System.quality_attributes
  - QualityModel.quality_attributes
  - Requirement.quality_attributes
  - QualityModelAttribute.subattribute_of
  - SystemQualityAttribute.subattribute_of
  inheritance: false
- title: System coordination
  description: Systems declare concept uses, dependencies, and coordination rules.
  nodes:
  - System
  - ConceptUse
  - Synchronization
  - ConceptAction
  paths:
  - System.concept_uses
  - System.synchronizations
  - ConceptUse.dependencies
  inheritance: false
- title: Explicit requirements relationships
  description: Explicit authoring distinguishes a use case boundary, support for user progress, and applicability
    from ordinary citations. Applicability may target any domain record; links do not establish enforcement,
    satisfaction or achieved outcomes.
  nodes:
  - UseCase
  - System
  - Job
  - JobStep
  - DesiredOutcome
  - Requirement
  - BusinessRule
  - DomainElement
  - Goal
  paths:
  - UseCase.subject_system
  - UseCase.supports
  - Requirement.applies_to
  - BusinessRule.applies_to
  inheritance: false
- title: Motivation, basis and assumptions
  description: Concern subsets are independent of artifact kind and core/supporting/generic classification.
    Explicit support describes intended contribution; derivation records a basis rather than entailment. Requirements
    may link directly to a business rule or design decision without an intervening user record. Assumptions
    condition validity. These links do not impose authoring order or prove satisfaction.
  nodes:
  - TraceableElement
  - Goal
  - Job
  - JobStep
  - DesiredOutcome
  - UseCase
  - DomainElement
  - SourceFragment
  - Assumption
  paths:
  - TraceableElement.supports
  - TraceableElement.derived_from
  - TraceableElement.relies_on
  inheritance: false
- title: Requirements and use cases
  description: A requirement file specifies one general property. Use cases describe interactions that exercise it.
    Refinement preserves a parent commitment and must be acyclic; multiple parents are permitted. A business
    rule refines only another business rule. Use cases involve named concept uses many-to-many; neither view
    is the mandatory parent of the other.
  nodes:
  - TraceableElement
  - Requirement
  - BusinessRule
  - UseCase
  - ConceptUse
  - Concept
  paths:
  - Requirement.refines
  - BusinessRule.refines
  - UseCase.involves
  - ConceptUse.definition
  inheritance: false
- title: Traceability to authored content
  description: References preserve authored targets and their resolution. Source ranges locate each field in the acquired Markdown.
  nodes:
  - Record
  - SourceReference
  - Resolution
  - DomainElement
  - SourceResource
  - SourceFragment
  paths:
  - SourceReference.resolution
  - Resolution.target
  inheritance: false
- title: Enabling capabilities
  description: Capabilities connect user needs to enabling abilities and explicit system or component providers.
    Dependency is not structural containment; providers are optional and non-exhaustive.
  nodes:
  - Capability
  - System
  - Component
  - Goal
  - Job
  - JobStep
  - DesiredOutcome
  - UseCase
  paths:
  - Capability.supports
  - Capability.depends_on
  - Capability.provided_by
  inheritance: false
