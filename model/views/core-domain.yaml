title: Core domain model
description: A focused reference for maintainers and authors understanding business requirements, user requirements,
  software requirements, and their traceability. Business rules describe business constraints independently
  of enforcement. Jobs describe user progress; use cases describe software interactions. Supporting and generic
  model machinery remains available in the complete reference.
