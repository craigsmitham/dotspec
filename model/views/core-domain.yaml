diagrams:
- title: Specification kinds and system association
  direction: TB
  show_cardinality: false
  description: Eight document kinds describe repository intent. Quality models stand independently. Other non-System
    kinds select a specification system explicitly or use the nearest directory system by default; this association
    does not establish structural parentage.
  nodes:
  - System
  - QualityModel
  - BusinessRule
  - Job
  - UseCase
  - Concept
  - Requirement
  - GeneralRequirement
  - QualityRequirement
  paths:
  - BusinessRule.specification_system
  - Job.specification_system
  - UseCase.specification_system
  - Concept.specification_system
  - Requirement.specification_system
  inheritance: true
- title: System structure and feature grouping
  description: Declaration membership identifies where records are authored. Explicit part_of identifies structural
    parents independently of directories. Features group specifications without owning them. Applicability
    identifies subjects; no implementation, allocation, inheritance or satisfaction is inferred.
  nodes:
  - System
  - Component
  - Feature
  - Requirement
  - UseCase
  - Concept
  - ObligationClause
  - ConceptUse
  - Synchronization
  - DomainElement
  paths:
  - System.part_of
  - Component.part_of
  - Feature.system
  - Feature.groups
  - Requirement.applies_to
  inheritance: false
- title: Shared obligation capabilities
  description: Both standalone requirement forms and embedded clauses share statement, classification, applicability
    and assessment plans through Obligation. ObligationContainer separately grants clause ownership to System,
    Component, BusinessRule, Job, JobStep, UseCase, Concept, ConceptUse, ConceptAction, Synchronization and Requirement.
    Goals, assumptions and desired outcomes retain traceability without containing clauses. Triangle arrows
    include explicitly mixed-in capabilities.
  direction: TB
  nodes:
  - Obligation
  - ObligationContainer
  - Requirement
  - GeneralRequirement
  - QualityRequirement
  - ObligationClause
  paths:
  - ObligationContainer.obligations
  inheritance: true
- title: User progress
  description: Jobs contain ordered steps, overall or per-step outcomes, and progress cases.
  nodes:
  - Job
  - JobStep
  - DesiredOutcome
  - ProgressCase
  paths:
  - Job.steps.steps
  - Job.outcomes.outcomes
  - Job.progress_cases.cases
  - JobStep.outcomes.outcomes
  inheritance: false
- title: Software behavior
  description: Use cases describe interactions and alternatives; concepts describe purposeful state and actions.
    These are complementary views, with no mandatory authoring or execution order.
  nodes:
  - UseCase
  - Scenario
  - ScenarioStep
  - UseCaseExtension
  - Concept
  - ConceptAction
  paths:
  - UseCase.main_success_scenario
  - UseCase.extensions.branches
  - Scenario.steps
  - UseCaseExtension.steps
  - UseCaseExtension.branches
  - Concept.actions.actions
  inheritance: false
- title: Quality classification
  description: 'Systems and reusable quality models declare attributes. Each attribute has exactly one declaring
    owner: a System or a QualityModel. Obligations reference attributes for classification. Sub-attribute of
    permits multiple parents within the same declaring owner and must be acyclic.'
  nodes:
  - System
  - QualityModel
  - QualityAttribute
  - Obligation
  paths:
  - System.quality_attributes
  - QualityModel.quality_attributes
  - Obligation.quality_attributes
  - QualityAttribute.subattribute_of
  inheritance: false
- title: Concept definitions and type bindings
  description: Explicit named uses reference reusable definitions. Bindings distinguish a type declaration
    from the use supplying its identities. Type parameters and introduced types share a declaration scope but
    play different roles.
  nodes:
  - ConceptUse
  - Concept
  - ConceptType
  - TypeBinding
  paths:
  - ConceptUse.definition
  - ConceptUse.bindings
  - Concept.type_parameters
  - Concept.introduced_types
  - TypeBinding.parameter
  - TypeBinding.bound_type
  - TypeBinding.supplying_concept_use
  inheritance: false
- title: System coordination
  description: Systems explicitly include named uses and own synchronization rules. Each referenced action
    is qualified by its use and must belong to that use's definition. Application dependencies are separately
    declared and may cycle. None of these relations implies execution, atomicity or behavioral completeness.
  nodes:
  - System
  - ConceptUse
  - Synchronization
  - SynchronizationAction
  - ConceptAction
  paths:
  - System.concept_uses
  - System.synchronizations
  - ConceptUse.dependencies
  - Synchronization.when_actions
  - Synchronization.then_actions
  - SynchronizationAction.concept_use
  - SynchronizationAction.action
  inheritance: false
- title: Explicit requirements relationships
  description: Explicit authoring distinguishes a use case boundary, support for user progress, and applicability
    from ordinary citations. Applicability may target any domain record; links do not establish enforcement,
    satisfaction or achieved outcomes.
  nodes:
  - UseCase
  - System
  - Job
  - JobStep
  - DesiredOutcome
  - Requirement
  - BusinessRule
  - DomainElement
  - SystemGoal
  paths:
  - UseCase.subject_system
  - UseCase.supports
  - Requirement.applies_to
  - BusinessRule.applies_to
  inheritance: false
- title: Motivation, basis and assumptions
  description: Concern subsets are independent of artifact kind and core/supporting/generic classification.
    Explicit support describes intended contribution; derivation records a basis rather than entailment. Requirements
    may link directly to a business rule or design decision without an intervening user record. Assumptions
    condition validity. These links do not impose authoring order or prove satisfaction.
  nodes:
  - TraceableElement
  - SystemGoal
  - Job
  - JobStep
  - DesiredOutcome
  - DomainElement
  - SourceFragment
  - Assumption
  paths:
  - TraceableElement.supports
  - TraceableElement.derived_from
  - TraceableElement.relies_on
  inheritance: false
- title: Obligations and complementary behavioral views
  description: Requirement is the standalone obligation document family, not every normative expression. Explicit
    clauses identify obligations within existing specifications without duplicating them. Refinement preserves
    a parent commitment and must be acyclic; multiple parents are permitted. Use cases involve named concept
    uses many-to-many; neither view is the mandatory parent of the other.
  nodes:
  - TraceableElement
  - ObligationClause
  - Requirement
  - BusinessRule
  - UseCase
  - ConceptUse
  - Concept
  - ObligationContainer
  paths:
  - ObligationContainer.obligations
  - ObligationClause.refines
  - Requirement.refines
  - BusinessRule.refines
  - UseCase.involves
  - ConceptUse.definition
  inheritance: false
- title: Traceability to authored content
  description: Bindings associate model fields with content occurrences; references preserve authored targets
    and their resolution. Record and ContentNode provide context from the generic subsets. A resolved target
    does not prove compliance.
  nodes:
  - ContentBinding
  - ContentNode
  - Record
  - SourceReference
  - Resolution
  - DomainElement
  - SourceResource
  - SourceFragment
  paths:
  - ContentBinding.content_node
  - ContentBinding.owner
  - SourceReference.resolution
  - Resolution.target
  inheritance: false
