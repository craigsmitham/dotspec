diagrams:
- title: Specification types
  direction: TB
  show_cardinality: false
  description: A Specification is the root record of one authored specification document. The seven specification
    types correspond one-to-one with these concrete classes. Subsets classify concerns separately from this
    hierarchy.
  nodes:
  - Specification
  - SystemContextSpecification
  - System
  - QualityModel
  - BusinessRule
  - Job
  - UseCase
  - Concept
  - Requirement
  paths: []
  inheritance: true
- title: Elements declared in a system specification
  description: Components, features, capabilities, concept uses, synchronizations and interfaces are named elements
    declared inside a System specification, not specifications themselves. Each has one declaring owner; declaration
    does not establish structural parentage.
  nodes:
  - System
  - Component
  - Feature
  - Capability
  - ConceptUse
  - Synchronization
  - Interface
  paths:
  - System.components
  - System.features
  - System.capabilities
  - System.concept_uses
  - System.synchronizations
  - System.required_interfaces
  - System.provided_interfaces
  - Component.required_interfaces
  - Component.provided_interfaces
  inheritance: false
- title: Specification system association
  direction: TB
  show_cardinality: false
  description: Specification types derived from SystemContextSpecification select a specification system explicitly
    or use the nearest directory system by default. Elements declared inside a specification have declaring
    owners instead. Neither association establishes structural parentage. Quality models stand independently.
  nodes:
  - System
  - BusinessRule
  - Job
  - UseCase
  - Concept
  - Requirement
  paths:
  - BusinessRule.specification_system
  - Job.specification_system
  - UseCase.specification_system
  - Concept.specification_system
  - Requirement.specification_system
  inheritance: false
- title: Boundary interfaces
  description: Required and provided are relative to the declaring System or Component. Each Interface is an
    addressable element with one declaration membership. Requirements can apply to it and it may own
    obligation clauses. Native contract references do not establish implementation or compatibility.
  nodes:
  - System
  - Component
  - Interface
  paths:
  - System.required_interfaces
  - System.provided_interfaces
  - Component.required_interfaces
  - Component.provided_interfaces
  inheritance: false
- title: System structure and feature grouping
  description: Declaration membership identifies where records are authored. Explicit part_of identifies structural
    parents independently of directories. Features group specifications without owning them. Applicability
    identifies subjects; no implementation, allocation, inheritance or satisfaction is inferred. Interacts
    with identifies boundary partners, independently of structural parentage.
  nodes:
  - System
  - Component
  - Feature
  - Requirement
  - UseCase
  - Concept
  - ObligationClause
  - ConceptUse
  - Synchronization
  - Interface
  - DomainElement
  paths:
  - System.part_of
  - Component.part_of
  - System.features
  - Feature.groups
  - Requirement.applies_to
  - System.interacts_with
  - Component.interacts_with
  inheritance: false
- title: Shared obligation capabilities
  description: A Requirement specification and an embedded clause share statement, classification, applicability,
    criterion and verification plan through Obligation. ObligationContainer separately grants clause ownership
    to System, Component, Interface, UseCase, Concept, ConceptUse, ConceptAction and Synchronization. A Requirement
    states one obligation and contains no clauses. Business rules, jobs, goals, assumptions and desired outcomes
    retain traceability without containing clauses. Triangle arrows include explicitly mixed-in capabilities.
  direction: TB
  nodes:
  - Obligation
  - ObligationContainer
  - Requirement
  - ObligationClause
  paths:
  - ObligationContainer.obligations
  inheritance: true
- title: User progress
  description: Jobs optionally declare functional steps, outcomes and progress cases. These edges describe
    declaration ownership; step order is presentation order.
  nodes:
  - Job
  - JobStep
  - DesiredOutcome
  - ProgressCase
  paths:
  - Job.steps
  - Job.outcomes
  - Job.progress_cases
  - JobStep.outcomes
  inheritance: false
- title: Outcome applicability
  description: An outcome can explicitly apply to several jobs or steps independently of its single declaration
    owner. Applicability does not assert achievement.
  nodes:
  - DesiredOutcome
  - Job
  - JobStep
  paths:
  - DesiredOutcome.applies_to
  inheritance: false
- title: Software behavior
  description: Use cases describe interactions and alternatives; concepts describe purposeful state and actions.
    These are complementary views, with no mandatory authoring or execution order. Steps may explicitly illustrate
    obligations, business rules or actions; this does not prove completeness.
  nodes:
  - UseCase
  - Scenario
  - ScenarioStep
  - UseCaseExtension
  - Concept
  - ConceptAction
  - Obligation
  - BusinessRule
  paths:
  - UseCase.main_success_scenario
  - UseCase.extensions
  - Scenario.steps
  - UseCaseExtension.steps
  - UseCaseExtension.branches
  - Concept.actions
  - ScenarioStep.illustrates
  inheritance: false
- title: Quality classification
  description: 'Systems and reusable quality models declare attributes. Each attribute has exactly one declaring
    owner: a System or a QualityModel. Obligations reference attributes for classification. Sub-attribute
    of permits multiple parents within the same declaring owner and must be acyclic.'
  nodes:
  - System
  - QualityModel
  - QualityAttribute
  - Obligation
  paths:
  - System.quality_attributes
  - QualityModel.quality_attributes
  - Obligation.quality_attributes
  - QualityAttribute.subattribute_of
  inheritance: false
- title: Concept definitions and type bindings
  description: Explicit named uses reference reusable definitions. Bindings distinguish a type declaration
    from the use supplying its identities. Type parameters and introduced types share a declaration scope
    but play different roles.
  nodes:
  - ConceptUse
  - Concept
  - ConceptType
  - TypeBinding
  paths:
  - ConceptUse.definition
  - ConceptUse.bindings
  - Concept.type_parameters
  - Concept.introduced_types
  - TypeBinding.parameter
  - TypeBinding.bound_type
  - TypeBinding.supplying_concept_use
  inheritance: false
- title: System coordination
  description: Systems explicitly include named uses and own synchronization rules. Each referenced action
    is qualified by its use and must belong to that use's definition. Application dependencies are separately
    declared and may cycle. None of these relations implies execution, atomicity or behavioral completeness.
  nodes:
  - System
  - ConceptUse
  - Synchronization
  - SynchronizationAction
  - ConceptAction
  paths:
  - System.concept_uses
  - System.synchronizations
  - ConceptUse.dependencies
  - Synchronization.when_actions
  - Synchronization.then_actions
  - SynchronizationAction.concept_use
  - SynchronizationAction.action
  inheritance: false
- title: Explicit requirements relationships
  description: Explicit authoring distinguishes a use case boundary, support for user progress, and applicability
    from ordinary citations. Applicability may target any domain record; links do not establish enforcement,
    satisfaction or achieved outcomes.
  nodes:
  - UseCase
  - System
  - Job
  - JobStep
  - DesiredOutcome
  - Requirement
  - BusinessRule
  - DomainElement
  - Goal
  paths:
  - UseCase.subject_system
  - UseCase.supports
  - Requirement.applies_to
  - BusinessRule.applies_to
  inheritance: false
- title: Motivation, basis and assumptions
  description: Concern subsets are independent of artifact kind and core/supporting/generic classification.
    Explicit support describes intended contribution; derivation records a basis rather than entailment. Requirements
    may link directly to a business rule or design decision without an intervening user record. Assumptions
    condition validity. These links do not impose authoring order or prove satisfaction.
  nodes:
  - TraceableElement
  - Goal
  - Job
  - JobStep
  - DesiredOutcome
  - UseCase
  - DomainElement
  - SourceFragment
  - Assumption
  paths:
  - TraceableElement.supports
  - TraceableElement.derived_from
  - TraceableElement.relies_on
  inheritance: false
- title: Obligations and complementary behavioral views
  description: Requirement is the specification type that gives one obligation its own document, not every normative
    expression. Explicit clauses identify obligations within other specifications without duplicating them.
    Refinement preserves a parent commitment and must be acyclic; multiple parents are permitted. A business
    rule refines only another business rule. Use cases involve named concept uses many-to-many; neither view
    is the mandatory parent of the other.
  nodes:
  - TraceableElement
  - ObligationClause
  - Requirement
  - BusinessRule
  - UseCase
  - ConceptUse
  - Concept
  - ObligationContainer
  paths:
  - ObligationContainer.obligations
  - ObligationClause.refines
  - Requirement.refines
  - BusinessRule.refines
  - UseCase.involves
  - ConceptUse.definition
  inheritance: false
- title: Traceability to authored content
  description: Bindings associate model fields with content occurrences; references preserve authored targets
    and their resolution. Record and ContentNode provide context from the generic subsets. A resolved target
    does not prove compliance.
  nodes:
  - ContentBinding
  - ContentNode
  - Record
  - SourceReference
  - Resolution
  - DomainElement
  - SourceResource
  - SourceFragment
  paths:
  - ContentBinding.content_node
  - ContentBinding.owner
  - SourceReference.resolution
  - Resolution.target
  inheritance: false
- title: Enabling capabilities
  description: Capabilities connect user needs to enabling abilities and explicit system or component providers.
    Dependency is not structural containment; providers are optional and non-exhaustive.
  nodes:
  - Capability
  - System
  - Component
  - Goal
  - Job
  - JobStep
  - DesiredOutcome
  - UseCase
  paths:
  - Capability.supports
  - Capability.depends_on
  - Capability.provided_by
  inheritance: false

- title: Assessment planning
  description: Verification and validation retain distinct field roles while sharing plan structure. The authored
    subject and basis identify what is assessed and against what. Neither plan nor case is an observation,
    assessment conclusion or acceptance decision.
  nodes:
  - TraceableElement
  - Obligation
  - AssessmentPlan
  - AssessmentCase
  paths:
  - TraceableElement.validation_plan
  - Obligation.verification_plan
  - AssessmentPlan.cases
  inheritance: false
