version: 2
project_name: dotspec
before:
  hooks:
    - python3 scripts/package-knowledge/package.py --version {{ .Version }} --output .release/dotspec-knowledge.zip
builds:
  - id: dotspec
    main: .
    binary: dotspec
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/craigsmitham/dotspec/internal/cli.version={{ .Version }}
      - -X github.com/craigsmitham/dotspec/internal/cli.commit={{ .Commit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CONTRIBUTING.md
      - docs/*.md
      - docs/**/*.md
      - docs/handbook/topics.json
      - examples/**/*.md
      - examples/**/*.yaml
      - specs/*.md
      - specs/**/*.md
      - model/README.md
      - model/markdown-mapping.md
      - model/metamodel.yaml
      - model/views/*.yaml
      - go.mod
checksum:
  extra_files:
    - glob: .release/dotspec-knowledge.zip
  name_template: checksums.txt
release:
  extra_files:
    - glob: .release/dotspec-knowledge.zip
  github:
    owner: craigsmitham
    name: dotspec
changelog:
  sort: asc
