version: 2
project_name: dotspec
before:
  hooks:
    - python3 scripts/package-knowledge/package.py --version {{ .Version }} --output .release/dotspec-knowledge.zip
builds:
  - id: dotspec
    main: .
    binary: dotspec
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/craigsmitham/dotspec/internal/cli.version={{ .Version }}
      - -X github.com/craigsmitham/dotspec/internal/cli.commit={{ .Commit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - docs/cli-handbook/README.md
      - docs/cli-handbook/**/*.md
      - docs/cli-handbook/topics.json
      - docs/reference/*.md
      - docs/reference/**/*.md
      - examples/todo/README.md
      - examples/todo/SPEC.md
      - examples/todo/dotspec.yaml
      - examples/todo/specs/*.spec.md
      - examples/todo/specs/**/*.spec.md
      - examples/todo/specs/**/*.quality-model.md
      - examples/todo/app/**/*.spec.md
      - examples/todo/specification/*.md
      - examples/todo/specification/**/*.md
      - examples/todo/tests/acceptance.py
      - specs/*.md
      - specs/**/*.md
      - model/markdown-mapping.md
      - model/metamodel.yaml
      - model/views/core-domain.yaml
      - model/generated/*.json
      - go.mod
checksum:
  extra_files:
    - glob: .release/dotspec-knowledge.zip
  name_template: checksums.txt
release:
  extra_files:
    - glob: .release/dotspec-knowledge.zip
  github:
    owner: craigsmitham
    name: dotspec
changelog:
  sort: asc
